all:
  children:
    cisco_switches:
      hosts:
        switch01:
          ansible_host: 10.77.55.1
          # Staged VLAN inputs; apply management before selecting new port roles.
          switch_vlans:
            - {vlan_id: 10, name: MGMT, state: active}
            - {vlan_id: 20, name: HOME, state: active}
            - {vlan_id: 30, name: DEV, state: active}
            - {vlan_id: 40, name: BMC, state: active}
            - {vlan_id: 999, name: UNUSED, state: active}
          switch_management:
            vlan: 10
            address: 10.77.10.2/24
            description: MGMT
            legacy_interface: Vlan1
            legacy_address: 10.77.55.1/24
          # Synthetic port assignments; replace these in your private inventory.
          switch_ports:
            - {role: idrac, name: GigabitEthernet1/0/16, description: IDRAC, access_vlan: 1, enabled: true}
            - {role: fortinet, name: GigabitEthernet1/0/18, description: FORTINET-LAN, access_vlan: 1, enabled: true}
            - {role: ap1, name: GigabitEthernet1/0/20, description: AP1, access_vlan: 1, enabled: true}
            - {role: ap2, name: GigabitEthernet1/0/22, description: AP2, access_vlan: 1, enabled: true}
            - {role: home_wired, name: GigabitEthernet1/0/24, description: HOME-WIRED, access_vlan: 1, enabled: true}
            - {role: recovery_mgmt, name: GigabitEthernet1/0/26, description: RECOVERY-MGMT, access_vlan: 10, enabled: true}
            - {role: recovery_bmc, name: GigabitEthernet1/0/28, description: RECOVERY-BMC, access_vlan: 40, enabled: true}
            - {role: server_mgmt, name: GigabitEthernet1/0/30, description: PVE-MGMT, access_vlan: 10, enabled: true}
            - {role: server_lan, name: GigabitEthernet1/0/32, description: PVE-LAN, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 30, 40], allow_mode_change: true, enabled: true}
            - {role: pilot_wan, name: GigabitEthernet1/0/34, description: PILOT-WAN, access_vlan: 1, enabled: true}
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_network_cli_ssh_type: paramiko
        ansible_host_key_checking: true
        ansible_paramiko_host_key_auto_add: false
        ansible_paramiko_look_for_keys: false
        ansible_persistent_log_messages: false
        ansible_user: "{{ vault_devices[inventory_hostname].username }}"
        ansible_password: "{{ vault_devices[inventory_hostname].ssh_password }}"
        ansible_become_password: "{{ vault_devices[inventory_hostname].enable_password }}"
    fortigates:
      hosts:
        fortigate01:
          # Must resolve to the device and match its verified TLS certificate.
          ansible_host: firewall.example.test
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: fortinet.fortios.fortios
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: true
        ansible_httpapi_port: 443
        ansible_httpapi_use_proxy: false
        ansible_httpapi_ca_path: "{{ inventory_dir }}/secrets/fortigate-ca.pem"
        ansible_persistent_log_messages: false
        ansible_user: "{{ vault_devices[inventory_hostname].username }}"
        ansible_password: "{{ vault_devices[inventory_hostname].password }}"
    idracs:
      hosts:
        idrac01:
          ansible_host: bmc.example.test
          idrac_expected_mac: '02:00:00:00:00:01'
          idrac_network:
            address: 10.77.40.10
            netmask: 255.255.255.0
            gateway: 10.77.40.254
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        idrac_ca_path: "{{ inventory_dir }}/secrets/idrac-ca.pem"
