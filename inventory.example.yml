all:
  children:
    cisco_switches:
      hosts:
        switch01:
          ansible_host: 10.77.55.1
          # Staged VLAN inputs; apply management before selecting new port roles.
          switch_vlans:
            - {vlan_id: 10, name: MGMT, state: active}
            - {vlan_id: 20, name: HOME, state: active}
            - {vlan_id: 30, name: DEV, state: active}
            - {vlan_id: 40, name: BMC, state: active}
            - {vlan_id: 999, name: UNUSED, state: active}
          switch_management:
            vlan: 10
            address: 10.77.10.2/24
            default_gateway: 10.77.10.254
            description: MGMT
            legacy_interface: Vlan1
            legacy_address: 10.77.55.1/24
          # Synthetic port assignments; replace these in your private inventory.
          switch_ports:
            - {role: home_pilot, name: GigabitEthernet1/0/36, description: HOME-PILOT, access_vlan: 20, enabled: true}
            - {role: idrac, name: GigabitEthernet1/0/16, description: IDRAC, access_vlan: 1, enabled: true}
            - {role: fortinet, name: GigabitEthernet1/0/18, description: FORTINET-LAN, access_vlan: 1, enabled: true}
            - {role: ap1, name: GigabitEthernet1/0/20, description: AP1, access_vlan: 1, enabled: true}
            - {role: ap2, name: GigabitEthernet1/0/22, description: AP2, access_vlan: 1, enabled: true}
            - {role: home_wired, name: GigabitEthernet1/0/24, description: HOME-WIRED, access_vlan: 1, enabled: true}
            - {role: recovery_mgmt, name: GigabitEthernet1/0/26, description: RECOVERY-MGMT, access_vlan: 10, enabled: true}
            - {role: recovery_bmc, name: GigabitEthernet1/0/28, description: RECOVERY-BMC, access_vlan: 40, enabled: true}
            - {role: server_mgmt, name: GigabitEthernet1/0/30, description: PVE-MGMT, access_vlan: 10, enabled: true}
            - {role: server_lan, name: GigabitEthernet1/0/32, description: PVE-LAN, mode: trunk, native_vlan: 999, allowed_vlans: [10, 20, 30, 40], allow_mode_change: true, enabled: true}
            - {role: pilot_wan, name: GigabitEthernet1/0/34, description: PILOT-WAN, access_vlan: 1, enabled: true}
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_network_cli_ssh_type: paramiko
        ansible_host_key_checking: true
        ansible_paramiko_host_key_auto_add: false
        ansible_paramiko_look_for_keys: false
        ansible_persistent_log_messages: false
        ansible_user: "{{ vault_devices[inventory_hostname].username }}"
        ansible_password: "{{ vault_devices[inventory_hostname].ssh_password }}"
        ansible_become_password: "{{ vault_devices[inventory_hostname].enable_password }}"
    fortigates:
      hosts:
        fortigate01:
          fortigate_pilot_dhcp:
            server_id: 1
            interface: lan
            subnet: 10.77.55.0/24
            gateway: 10.77.55.254
            reservations:
              - {role: pilot_wan, id: 9001, address: 10.77.55.132, mac: '02:77:00:00:64:00'}
              - {role: wifi_admin, id: 9002, address: 10.77.55.128, mac: '02:77:00:00:00:80'}
          # Must resolve to the device and match its verified TLS certificate.
          ansible_host: firewall.example.test
          fortigate_controller_endpoint:
            hostname: firewall.example.test
            address: 10.77.55.254
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: fortinet.fortios.fortios
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: true
        ansible_httpapi_port: 443
        ansible_httpapi_use_proxy: false
        ansible_httpapi_ca_path: "{{ inventory_dir }}/secrets/fortigate-ca.pem"
        ansible_persistent_log_messages: false
        ansible_user: "{{ vault_devices[inventory_hostname].username }}"
        ansible_password: "{{ vault_devices[inventory_hostname].password }}"
    idracs:
      hosts:
        idrac01:
          ansible_host: bmc.example.test
          idrac_expected_mac: '02:00:00:00:00:01'
          idrac_network:
            address: 10.77.40.10
            netmask: 255.255.255.0
            gateway: 10.77.40.254
          # Native Mac file and Ethernet address for mount-idrac-iso.yml.
          idrac_iso_path: /Users/example/Repos/home/.cache/iso/installer.iso
          idrac_iso_sha256: '<expected lowercase ISO SHA-256>'
          idrac_iso_bind_address: 10.77.40.250
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        idrac_ca_path: "{{ inventory_dir }}/secrets/idrac-ca.pem"
    proxmox_hosts:
      hosts:
        pve01:
          ansible_host: 10.77.10.10
          proxmox_idrac_host: idrac01
          proxmox_host_repository: no-subscription
          opnsense_guest: opnsense01
          opnsense_vm:
            vmid: 100
            name: opnsense01
            cores: 4
            memory_mib: 8192
            disk_gib: 32
            disk_storage: local-lvm
            iso_storage: local
            onboot: false
            # Set true after installation/pilot setup for configure-proxmox-boot.yml.
            wan_connected: false
            networks:
              - {device: net0, role: WAN, bridge: vmbr2, mac: '02:77:00:00:64:00'}
              - {device: net1, role: MGMT, bridge: vmbr1, mac: '02:77:00:00:64:01', tag: 10}
              - {device: net2, role: HOME, bridge: vmbr1, mac: '02:77:00:00:64:02', tag: 20}
              - {device: net3, role: DEV, bridge: vmbr1, mac: '02:77:00:00:64:03', tag: 30}
              - {device: net4, role: BMC, bridge: vmbr1, mac: '02:77:00:00:64:04', tag: 40}
          proxmox_network:
            management:
              bridge: vmbr0
              port: eno1
              mac: '02:00:00:00:00:10'
              address: 10.77.10.10/24
              gateway: 10.77.10.254
            guest_bridges:
              - {name: vmbr1, port: eno2, mac: '02:00:00:00:00:11', vlan_aware: true, vlans: [10, 20, 30, 40]}
              - {name: vmbr2, port: eno3, mac: '02:00:00:00:00:12', vlan_aware: false}
          proxmox_install:
            source_iso: "{{ inventory_dir }}/.cache/iso/installer.iso"
            source_sha256: '<expected lowercase original ISO SHA-256>'
            fqdn: pve01.lab.home.arpa
            mailto: admin@example.test
            country: us
            keyboard: en-us
            timezone: UTC
            cidr: 10.77.10.10/24
            gateway: 10.77.10.254
            dns: 10.77.10.254
            disk_serial: '<exact observed ID_SERIAL>'
            management_mac: '02:00:00:00:00:10'
            maxroot: 96
            swapsize: 8
            minfree: 32
            ssh_public_key_files:
              - "{{ inventory_dir }}/.cache/proxmox-installer-inputs/admin.pub"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
    opnsense_hosts:
      hosts:
        opnsense01:
          opnsense_proxmox_host: pve01
          ansible_host: 10.77.10.254
          # Management pilot; select wan_connected: true on pve01 when using it.
          opnsense_wireguard:
            name: home_admin
            peer_name: admin_mac
            port: 51820
            tunnel_subnet: 10.77.99.0/24
            server_address: 10.77.99.1
            peer_address: 10.77.99.2
            endpoint: 10.77.200.254
            management_subnet: 10.77.10.0/24
            management_address: 10.77.10.254
            proxmox_address: 10.77.10.10
            switch_host: switch01
            switch_address: 10.77.10.2
          opnsense_wireguard_wifi:
            wan_address: 10.77.55.132
            wifi_address: 10.77.55.128
            wan_gateway: 10.77.55.254
            wan_mac: '02:77:00:00:64:00'
          opnsense_home_pilot:
            address: 10.77.200.254
            subnet: 10.77.200.0/24
            pool_start: 10.77.200.100
            pool_end: 10.77.200.199
            lease_seconds: 3600
          opnsense_pilot:
            admin_addresses: [10.77.10.250]
            update_addresses: [10.77.10.10]
            wan_gateway: 10.77.55.254
            # Documentation-only addresses: replace with your actual resolvers.
            dns_servers: [192.0.2.53, 198.51.100.53]
            ntp_servers:
              - 0.opnsense.pool.ntp.org
              - 1.opnsense.pool.ntp.org
              - 2.opnsense.pool.ntp.org
              - 3.opnsense.pool.ntp.org
            dns_hosts:
              - {hostname: opnsense01, address: 10.77.10.254}
              - {hostname: pve01, address: 10.77.10.10}
              - {hostname: switch01, address: 10.77.10.2}
          opnsense_bootstrap:
            filesystem: zfs
            hostname: opnsense01
            domain: lab.home.arpa
            timezone: Etc/UTC
            prefix: 24
            ssh_public_key_files:
              - "{{ inventory_dir }}/.cache/proxmox-installer-inputs/admin.pub"
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
          -o IdentitiesOnly=yes
          -o UserKnownHostsFile={{ (inventory_dir ~ '/.cache/opnsense-bootstrap/' ~ opnsense_proxmox_host ~ '/known_hosts') | quote }}
