---
- name: Back up iDRAC before a prepared network transition
  ansible.builtin.import_playbook: backup-idrac.yml
  when:
    - idrac_network_operation | default('preview') == 'apply'
    - idrac_network_recovery_ready | default(false) | bool
    - not ansible_check_mode

- name: Preview, submit, inspect or verify a bounded iDRAC IPv4 transition
  hosts: idracs
  connection: local
  gather_facts: false
  become: false
  serial: 1
  vars:
    vault_file: "{{ playbook_dir }}/../secrets/vault.yml"
    backup_root: "{{ playbook_dir }}/../backups"
    idrac_network_operation: preview
    idrac_network_mode: static
    manager_path: /redfish/v1/Managers/iDRAC.Embedded.1
    ethernet_path: /redfish/v1/Managers/iDRAC.Embedded.1/EthernetInterfaces/iDRAC.Embedded.1%23NIC.1
    preview_path: /redfish/v1/Managers/iDRAC.Embedded.1/Actions/Oem/EID_674_Manager.ImportSystemConfigurationPreview
    import_path: /redfish/v1/Managers/iDRAC.Embedded.1/Actions/Oem/EID_674_Manager.ImportSystemConfiguration
    network_task_details: "{{ (network_verify_task.json | default({})).get('Oem', {}).get('Dell', {}) }}"
    network_task_messages: "{{ (network_verify_task.json | default({})).get('Messages', []) | map(attribute='Message', default='') | join(' ') }}"
    network_waiting_for_reboot: >-
      {{ (network_task_messages ~ ' ' ~ network_task_details.get('Message', ''))
         is search('(?i)waiting\s+(?:for|on)\s+(?:a\s+)?(?:system\s+)?reboot') }}
  vars_files:
    - "{{ vault_file }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ vault_devices[inventory_hostname].username }}"
      url_password: "{{ vault_devices[inventory_hostname].password }}"
      force_basic_auth: true
      validate_certs: true
      ca_path: "{{ idrac_ca_path }}"
      ciphers: "{{ idrac_tls_ciphers | default(omit) }}"
      follow_redirects: none
      use_proxy: false
      return_content: true
      timeout: 30
  tasks:
    - name: Require explicit operation and a prepared recovery path for apply
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - idrac_network_operation in ['preview', 'apply', 'status', 'verify']
          - idrac_network_mode in ['static', 'dhcp']
          - idrac_expected_mac is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
          - idrac_network_operation != 'apply' or (idrac_network_recovery_ready | default(false) | bool)
          - idrac_network_operation != 'apply' or idrac_backup_directory is defined
        fail_msg: Use a normal preview run or syntax-check. Apply requires a staged wired recovery path and a successful automatic backup.

    - name: Validate static IPv4 inputs without sending anything to iDRAC
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import ipaddress, sys
            address, mask, gateway = sys.argv[1:]
            interface = ipaddress.IPv4Interface(address + '/' + mask)
            network = interface.network
            router = ipaddress.IPv4Address(gateway)
            assert str(interface.ip) == address, 'Use a canonical IPv4 address'
            assert str(network.netmask) == mask, 'Use a canonical subnet mask'
            assert network.prefixlen == 24, 'This workflow is bounded to /24'
            assert interface.ip.is_private and not interface.ip.is_loopback and not interface.ip.is_link_local
            assert interface.ip not in (network.network_address, network.broadcast_address)
            assert router in network and router not in (network.network_address, network.broadcast_address, interface.ip)
          - "{{ idrac_network.address }}"
          - "{{ idrac_network.netmask }}"
          - "{{ idrac_network.gateway }}"
      changed_when: false
      when: idrac_network_mode == 'static' and idrac_network_operation != 'status'

    - name: Validate verification task path before sending credentials
      ansible.builtin.assert:
        that: idrac_network_task_path is match('^/redfish/v1/TaskService/Tasks/[A-Za-z0-9_.-]+$')
        fail_msg: Supply the relative task_path from the saved apply submission record.
      when: idrac_network_operation in ['status', 'verify']

    - name: Read manager, system and the encoded Ethernet member
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ item }}"
        status_code: 200
      loop:
        - "{{ manager_path }}"
        - /redfish/v1/Systems/System.Embedded.1
        - "{{ ethernet_path }}"
      register: network_before
      no_log: true

    - name: Require the expected enabled untagged iDRAC interface
      ansible.builtin.assert:
        that:
          - network_before.results[0].json.FirmwareVersion is defined
          - network_before.results[1].json.SKU is match('^[A-Za-z0-9]{1,32}$')
          - network_before.results[2].json.MACAddress | lower == idrac_expected_mac | lower
          - network_before.results[2].json.InterfaceEnabled
          - not network_before.results[2].json.VLAN.VLANEnable
          - network_before.results[2].json.IPv4Addresses | length == 1
        fail_msg: Identity or current networking differs from the supported untagged transition.
      no_log: true

    - name: Determine whether the requested IPv4 state is already present
      ansible.builtin.set_fact:
        network_already_configured: >-
          {{ (idrac_network_mode == 'dhcp' and current_ipv4.AddressOrigin == 'DHCP') or
             (idrac_network_mode == 'static' and current_ipv4.AddressOrigin == 'Static' and
              current_ipv4.Address == idrac_network.address and
              current_ipv4.SubnetMask == idrac_network.netmask and
              current_ipv4.Gateway == idrac_network.gateway) }}
      vars:
        current_ipv4: "{{ network_before.results[2].json.IPv4Addresses[0] }}"
      when: idrac_network_operation != 'status'

    - name: Read the submitted task through the currently reachable endpoint
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ idrac_network_task_path }}"
        status_code: [200, 202]
      register: network_verify_task
      until: idrac_network_operation == 'status' or network_verify_task.status | default(0) not in [200, 202] or network_waiting_for_reboot or (network_verify_task.json | default({})).get('TaskState', '') in ['Completed', 'Exception', 'Killed', 'Cancelled', 'Interrupted', 'Suspended']
      retries: 12
      delay: 5
      no_log: true
      when: idrac_network_operation in ['status', 'verify']

    - name: Report task state without claiming configuration completion
      ansible.builtin.debug:
        msg:
          task_path: "{{ idrac_network_task_path }}"
          task_state: "{{ network_verify_task.json.TaskState | default('unknown') }}"
          task_status: "{{ network_verify_task.json.TaskStatus | default('unknown') }}"
          job_state: "{{ network_task_details.get('JobState', 'unknown') }}"
          percent_complete: "{{ network_task_details.get('PercentComplete', 'unknown') }}"
          waiting_for_host_reboot: "{{ network_waiting_for_reboot }}"
          current_ipv4: "{{ network_before.results[2].json.IPv4Addresses }}"
      when: idrac_network_operation in ['status', 'verify']

    - name: Finish the read-only status operation
      ansible.builtin.meta: end_host
      when: idrac_network_operation == 'status'

    - name: Require successful task completion as well as live networking
      ansible.builtin.assert:
        that:
          - network_verify_task.json.TaskState == 'Completed'
          - network_verify_task.json.TaskStatus in ['OK', 'Ok']
        fail_msg: Import is not successfully completed. If status reports waiting_for_host_reboot, a previously staged NoReboot import needs the operator's host reboot; do not resubmit the import.
      when: idrac_network_operation == 'verify'

    - name: Require the requested IPv4 state during verification
      ansible.builtin.assert:
        that: network_already_configured
        fail_msg: The recovered endpoint has not reached the requested IPv4 state.
      when: idrac_network_operation == 'verify'

    - name: Read the interface again after task completion
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ ethernet_path }}"
        status_code: 200
      register: network_verified_interface
      no_log: true
      when: idrac_network_operation == 'verify'

    - name: Verify the final enabled untagged interface and IPv4 settings
      ansible.builtin.assert:
        that:
          - network_verified_interface.json.MACAddress | lower == idrac_expected_mac | lower
          - network_verified_interface.json.InterfaceEnabled
          - not network_verified_interface.json.VLAN.VLANEnable
          - network_verified_interface.json.IPv4Addresses | length == 1
          - idrac_network_mode != 'dhcp' or final_ipv4.AddressOrigin == 'DHCP'
          - idrac_network_mode != 'static' or (final_ipv4.AddressOrigin == 'Static' and final_ipv4.Address == idrac_network.address and final_ipv4.SubnetMask == idrac_network.netmask and final_ipv4.Gateway == idrac_network.gateway)
      vars:
        final_ipv4: "{{ network_verified_interface.json.IPv4Addresses[0] }}"
      no_log: true
      when: idrac_network_operation == 'verify'

    - name: Report recovered configuration and task verification
      ansible.builtin.debug:
        msg: Verified expected iDRAC identity, untagged interface, requested IPv4 settings and completed import task through the recovered endpoint.
      when: idrac_network_operation == 'verify'

    - name: Finish the verification operation
      ansible.builtin.meta: end_host
      when: idrac_network_operation == 'verify'

    - name: Find advertised profile preview and import actions
      ansible.builtin.set_fact:
        network_preview_actions: "{{ network_before.results[0].json.Actions.Oem | dict2items | selectattr('key', 'search', '#OemManager.ImportSystemConfigurationPreview$') | map(attribute='value') | list }}"
        network_import_actions: "{{ network_before.results[0].json.Actions.Oem | dict2items | selectattr('key', 'search', '#OemManager.ImportSystemConfiguration$') | map(attribute='value') | list }}"
      no_log: true

    - name: Require local profile preview and iDRAC import support
      ansible.builtin.assert:
        that:
          - network_preview_actions | length == 1
          - network_import_actions | length == 1
          - network_preview_actions[0].target == preview_path
          - network_import_actions[0].target == import_path
          - "'ImportBuffer' in network_preview_actions[0]['ImportSystemConfigurationPreview@Redfish.AllowableValues']"
          - "'ImportBuffer' in network_import_actions[0]['ImportSystemConfiguration@Redfish.AllowableValues']"
          - "'ALL' in network_preview_actions[0].ShareParameters['Target@Redfish.AllowableValues']"
          - "'IDRAC' in network_import_actions[0].ShareParameters['Target@Redfish.AllowableValues']"
      no_log: true

    - name: Read existing job collection before profile submission
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ manager_path }}/Jobs"
        status_code: 200
      register: network_jobs
      no_log: true

    - name: Require a complete bounded job collection
      ansible.builtin.assert:
        that:
          - network_jobs.json.Members | length <= 64
          - network_jobs.json['Members@odata.count'] == network_jobs.json.Members | length
          - "'Members@odata.nextLink' not in network_jobs.json"
      no_log: true

    - name: Validate job paths before sending credentials
      ansible.builtin.assert:
        that: item['@odata.id'] is match('^/redfish/v1/Managers/iDRAC[.]Embedded[.]1/Jobs/[A-Za-z0-9_-]+$')
      loop: "{{ network_jobs.json.Members }}"
      no_log: true

    - name: Read existing job states
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ item['@odata.id'] }}"
        status_code: 200
      loop: "{{ network_jobs.json.Members }}"
      register: network_job_states
      no_log: true

    - name: Refuse profile submission with unfinished or unrecognized jobs
      ansible.builtin.assert:
        that: item.json.JobState in ['Completed', 'Failed', 'RebootCompleted', 'Completed with Errors']
      loop: "{{ network_job_states.results }}"
      no_log: true

    - name: Report an already configured interface on apply
      ansible.builtin.debug:
        msg: Requested IPv4 settings are already present; no import was submitted.
      when: idrac_network_operation == 'apply' and network_already_configured

    - name: Finish an already configured apply without importing
      ansible.builtin.meta: end_host
      when: idrac_network_operation == 'apply' and network_already_configured

    - name: Build a partial profile containing only the requested IPv4 settings
      ansible.builtin.set_fact:
        network_profile: |
          <SystemConfiguration ServiceTag="{{ network_before.results[1].json.SKU }}">
          <Component FQDD="iDRAC.Embedded.1">
          <Attribute Name="IPv4.1#DHCPEnable">{{ 'Disabled' if idrac_network_mode == 'static' else 'Enabled' }}</Attribute>
          {% if idrac_network_mode == 'static' %}
          <Attribute Name="IPv4Static.1#Address">{{ idrac_network.address }}</Attribute>
          <Attribute Name="IPv4Static.1#Netmask">{{ idrac_network.netmask }}</Attribute>
          <Attribute Name="IPv4Static.1#Gateway">{{ idrac_network.gateway }}</Attribute>
          {% endif %}
          </Component>
          </SystemConfiguration>

    - name: Create private maintenance parent
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'

    - name: Allocate a private network maintenance record
      ansible.builtin.tempfile:
        state: directory
        path: "{{ backup_root }}"
        prefix: "{{ inventory_hostname }}-network-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-"
      register: network_directory

    - name: Save the bounded profile and pre-change interface
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: '0600'
      loop:
        - {name: profile.xml, content: "{{ network_profile }}"}
        - {name: before.json, content: "{{ network_before.results[2].json | to_nice_json }}\n"}
      no_log: true
      diff: false

    - name: Record preview intent before the non-retried submission
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/intent.json"
        mode: '0600'
        content: "{{ {'operation': idrac_network_operation, 'mode': idrac_network_mode, 'status': 'preview_submission_pending', 'configuration_applied': false} | to_nice_json }}\n"

    - name: Report the private record before submitting a task
      ansible.builtin.debug:
        msg: "Network maintenance record: {{ network_directory.path }}"

    - name: Submit the partial profile for validation without applying it
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ preview_path }}"
        method: POST
        body_format: json
        body:
          ImportBuffer: "{{ network_profile }}"
          ShareParameters:
            Target: ALL
        status_code: 202
      register: network_preview_submission
      changed_when: true
      no_log: true

    - name: Save the preview response before validating its task location
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/preview-submission.json"
        mode: '0600'
        content: "{{ {'location': network_preview_submission.location | default(''), 'body': network_preview_submission.json | default({})} | to_nice_json }}\n"
      no_log: true
      diff: false

    - name: Require a preview task on the authenticated origin
      ansible.builtin.assert:
        that: network_preview_submission.location is match('^(https://' ~ (ansible_host | regex_escape) ~ ')?/redfish/v1/TaskService/Tasks/[A-Za-z0-9_.-]+$')
      no_log: true

    - name: Normalize the verified preview task URL
      ansible.builtin.set_fact:
        network_preview_url: "{{ network_preview_submission.location if network_preview_submission.location.startswith('https://') else 'https://' ~ ansible_host ~ network_preview_submission.location }}"
      no_log: true

    - name: Receive and preserve the profile validation result
      block:
        - name: Wait for the preview task to finish
          ansible.builtin.uri:
            url: "{{ network_preview_url }}"
            status_code: [200, 202]
          register: network_preview_task
          until: network_preview_task.status | default(0) not in [200, 202] or (network_preview_task.json | default({})).get('TaskState', '') in ['Completed', 'Exception', 'Killed', 'Cancelled', 'Interrupted', 'Suspended']
          retries: 24
          delay: 5
          no_log: true
      always:
        - name: Preserve the last preview response even after failure
          ansible.builtin.copy:
            dest: "{{ network_directory.path }}/preview-task.json"
            mode: '0600'
            content: "{{ {'http_status': network_preview_task.status | default(0), 'body': network_preview_task.json | default({})} | to_nice_json }}\n"
          no_log: true
          diff: false

    - name: Require successful preview before any configuration import
      ansible.builtin.assert:
        that:
          - network_preview_task.json.TaskState == 'Completed'
          - network_preview_task.json.TaskStatus in ['OK', 'Ok']
        fail_msg: Preview failed; inspect the private task record. No configuration import has been submitted.

    - name: Record successful validation separately from configuration application
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/intent.json"
        mode: '0600'
        content: "{{ {'operation': idrac_network_operation, 'mode': idrac_network_mode, 'status': 'preview_complete', 'configuration_applied': false} | to_nice_json }}\n"

    - name: Report the completed preview and profile location
      ansible.builtin.debug:
        msg: "Profile validation succeeded without applying settings. Private record: {{ network_directory.path }}"
      when: idrac_network_operation == 'preview'

    - name: Finish the preview without applying configuration
      ansible.builtin.meta: end_host
      when: idrac_network_operation == 'preview'

    - name: Record import intent before an operation that can drop connectivity
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/intent.json"
        mode: '0600'
        content: "{{ {'operation': 'apply', 'mode': idrac_network_mode, 'status': 'import_submission_pending', 'backup_directory': idrac_backup_directory, 'configuration_applied': 'unverified'} | to_nice_json }}\n"

    # On iDRAC8, explicitly passing NoReboot stages even iDRAC-only settings
    # until a host reboot. Omit power-control options for this iDRAC-only profile.
    - name: Submit only the iDRAC IPv4 settings once without deferred staging
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ import_path }}"
        method: POST
        body_format: json
        body:
          ImportBuffer: "{{ network_profile }}"
          ShareParameters:
            Target: IDRAC
        status_code: 202
      register: network_import_submission
      changed_when: true
      no_log: true

    - name: Preserve the import submission without claiming completion
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/import-submission.json"
        mode: '0600'
        content: "{{ {'location': network_import_submission.location | default(''), 'body': network_import_submission.json | default({}), 'configuration_applied': 'unverified'} | to_nice_json }}\n"
      no_log: true
      diff: false

    - name: Require an import task on the authenticated origin
      ansible.builtin.assert:
        that: network_import_submission.location is match('^(https://' ~ (ansible_host | regex_escape) ~ ')?/redfish/v1/TaskService/Tasks/[A-Za-z0-9_.-]+$')
      no_log: true

    - name: Record accepted import separately from completed application
      ansible.builtin.copy:
        dest: "{{ network_directory.path }}/intent.json"
        mode: '0600'
        content: "{{ {'operation': 'apply', 'mode': idrac_network_mode, 'status': 'import_accepted', 'task_path': network_import_submission.location | regex_replace('^https://' ~ (ansible_host | regex_escape), ''), 'backup_directory': idrac_backup_directory, 'configuration_applied': 'unverified'} | to_nice_json }}\n"

    - name: Report accepted submission and the required recovery verification
      ansible.builtin.debug:
        msg:
          - "Import accepted; completion is unverified. Record: {{ network_directory.path }}"
          - "Verification task_path: {{ network_import_submission.location | regex_replace('^https://' ~ (ansible_host | regex_escape), '') }}"
          - HTTP acceptance does not establish completion. Use operation=status on the reachable endpoint to inspect the saved task; operation=verify requires completed task and final IPv4 settings.
          - Complete the coordinated switch-port move, restore verified hostname resolution from the recovery network, then run this workflow with operation=verify and the saved task path. Do not retry the import after a lost response without inspecting the endpoint and task.
