---
- name: Prepare the isolated UniFi controller artifacts
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  serial: 1
  roles:
  - role: unifi_vm
    unifi_vm_options:
      task_action: prepare
