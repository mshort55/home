---
- name: 'opnsense_media: download'
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  connection: local
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    ansible_connection: local
  roles:
  - role: opnsense_media
    opnsense_media_options:
      task_action: download
