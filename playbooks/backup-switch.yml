---
- name: Export Cisco running and startup configurations without changing them
  hosts: cisco_switches
  gather_facts: false
  become: true
  become_method: enable
  serial: 1
  vars:
    backup_root: "{{ playbook_dir }}/../backups"

  tasks:
    - name: Require a real read-only collection run rather than check-mode output
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use --syntax-check for offline validation; a backup requires a normal run.

    - name: Read privilege level and both configurations
      cisco.ios.ios_command:
        commands:
          - show privilege
          - show running-config
          - show startup-config
        retries: 1
      register: switch_export
      changed_when: false
      no_log: true

    - name: Require privileged access and complete configuration responses
      ansible.builtin.assert:
        that:
          - switch_export.stdout | length == 3
          - "'Current privilege level is 15' in switch_export.stdout[0]"
          - switch_export.stdout[1] is search('(?m)^version \\S+')
          - switch_export.stdout[2] is search('(?m)^version \\S+')
          - switch_export.stdout[1] is search('(?m)^end\\s*$')
          - switch_export.stdout[2] is search('(?m)^end\\s*$')
        fail_msg: Incomplete or unauthorized configuration response; no backup files were written.
      no_log: true

    - name: Create private backup parent directory
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Allocate a unique directory for this backup
      ansible.builtin.tempfile:
        state: directory
        path: "{{ backup_root }}"
        prefix: "{{ inventory_hostname }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-"
      register: backup_directory
      delegate_to: localhost
      become: false

    - name: Write configuration exports without displaying their contents
      ansible.builtin.copy:
        content: "{{ switch_export.stdout[item.index] }}\n"
        dest: "{{ backup_directory.path }}/{{ item.name }}.cfg"
        mode: '0600'
      loop:
        - {name: running, index: 1}
        - {name: startup, index: 2}
      delegate_to: localhost
      become: false
      no_log: true
      diff: false

    - name: Calculate file sizes and SHA-256 checksums locally
      ansible.builtin.stat:
        path: "{{ backup_directory.path }}/{{ item }}.cfg"
        checksum_algorithm: sha256
      loop: [running, startup]
      register: backup_files
      delegate_to: localhost
      become: false

    - name: Confirm protected nonempty backup files
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - item.stat.size > 0
          - item.stat.mode == '0600'
      loop: "{{ backup_files.results }}"
      loop_control:
        label: "{{ item.item }}.cfg"
      no_log: true

    - name: Compare configuration bodies without displaying differences
      ansible.builtin.set_fact:
        backup_configurations_match: >-
          {{ (switch_export.stdout[1] | regex_search('(?ms)^version .*')) ==
             (switch_export.stdout[2] | regex_search('(?ms)^version .*')) }}
      no_log: true

    - name: Write completion manifest only after both files are verified
      ansible.builtin.copy:
        dest: "{{ backup_directory.path }}/manifest.yml"
        mode: '0600'
        content: |
          status: complete
          collected_at_utc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          inventory_host: "{{ inventory_hostname }}"
          source_address: "{{ ansible_host }}"
          privilege_level: 15
          configuration_changed_on_switch: false
          configuration_bodies_match: {{ backup_configurations_match | bool | lower }}
          files:
            running:
              bytes: {{ backup_files.results[0].stat.size }}
              sha256: "{{ backup_files.results[0].stat.checksum }}"
            startup:
              bytes: {{ backup_files.results[1].stat.size }}
              sha256: "{{ backup_files.results[1].stat.checksum }}"
      delegate_to: localhost
      become: false
      diff: false

    - name: Report backup location without configuration contents
      ansible.builtin.debug:
        msg: "Backup complete: {{ backup_directory.path }} (running.cfg, startup.cfg, manifest.yml). Running/startup bodies match: {{ backup_configurations_match }}. Switch configuration was not changed."
