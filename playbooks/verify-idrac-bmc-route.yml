---
- name: Verify the current dedicated iDRAC BMC return route
  hosts: idracs
  gather_facts: false
  become: false
  connection: local
  vars_files:
    - "{{ vault_file | default(((playbook_dir ~ '/..') | realpath) ~ '/secrets/vault.yml') }}"
  roles:
    - role: idrac_network
      idrac_network_options: {task_action: verify_current}
