---
- ansible.builtin.import_playbook: create-opnsense-vm.yml
  vars:
    opnsense_verify_only: true
    opnsense_verify_wan_state: false

- name: Configure management services and verify policy before pilot WAN attachment
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  vars:
    pilot_settings: "{{ hostvars[opnsense_guest].opnsense_pilot }}"
    pilot_code: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/configure-opnsense-pilot.php') | b64encode }}"
    pilot_prefix: "printf '%s' {{ pilot_code | quote }} | /usr/bin/base64 -d | /usr/local/bin/php --"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ pve_api.api_host }}"
      api_user: "{{ pve_api.api_user }}"
      api_token_id: "{{ pve_api.api_token_id }}"
      api_token_secret: "{{ pve_api.api_token_secret }}"
      validate_certs: true
      ca_path: "{{ inventory_dir }}/.cache/community-api/{{ inventory_hostname }}/ca.pem"
      api_timeout: 30
  tasks:
    - name: Load the enrolled guest API
      ansible.builtin.include_tasks: tasks/load-community-api.yml
      vars:
        community_api_host: "{{ opnsense_guest }}"
        community_api_var: opn_api

    - name: Require the installed guest and explicitly selected pilot inputs
      ansible.builtin.assert:
        that:
          - opnsense_guest in groups.get('opnsense_hosts', [])
          - hostvars[opnsense_guest].opnsense_proxmox_host == inventory_hostname
          - pilot_settings is mapping
          - pilot_settings.admin_addresses is sequence
          - pilot_settings.update_addresses is sequence
          - pilot_settings.dns_servers | length == 2
          - pilot_settings.ntp_servers | length > 0
          - pilot_settings.dns_hosts is sequence
          - opnsense_vm.wan_connected is sameas true
        fail_msg: Define management pilot inputs on the guest and select a connected pilot WAN in the Proxmox VM inventory.

    - name: Build the installed MAC and role identities
      ansible.builtin.set_fact:
        pilot_networks: []

    - name: Associate each VM NIC with its installed guest section
      ansible.builtin.set_fact:
        pilot_networks: "{{ pilot_networks + [item | combine({'section': sections[item.role]})] }}"
      loop: "{{ opnsense_vm.networks }}"
      vars:
        sections: {WAN: wan, MGMT: lan, HOME: opt1, DEV: opt2, BMC: opt3}

    - name: Build the bounded guest configuration payload
      ansible.builtin.set_fact:
        pilot_payload: "{{ pilot_settings | combine({'management_address': hostvars[opnsense_guest].ansible_host, 'networks': pilot_networks}) }}"

    - name: Select the explicitly requested HOME pilot allocation
      ansible.builtin.set_fact:
        pilot_payload: "{{ pilot_payload | combine({'home_pilot': hostvars[opnsense_guest].opnsense_home_pilot}) }}"
      when: opnsense_home_requested | default(false) | bool

    - name: Validate the installed identity and preview vendor model changes without saving
      ansible.builtin.raw: "{{ pilot_prefix }} plan {{ pilot_payload | to_json | b64encode | quote }}"
      delegate_to: "{{ opnsense_guest }}"
      register: pilot_preview
      changed_when: pilot_preview.rc == 0 and ansible_check_mode and (pilot_preview.stdout | trim | from_json).reload_required
      check_mode: false

    - name: Require DHCP API enrollment before previewing HOME writes
      ansible.builtin.assert:
        that:
          - (pilot_preview.stdout | trim | from_json).dhcp_api_ready
        fail_msg: Run configure-opnsense-api.yml for the guest to enroll the Kea DHCP privilege, then rerun this playbook.
      when: (pilot_preview.stdout | trim | from_json).home_pilot is not none

    - name: Report the scoped pilot preview
      ansible.builtin.debug:
        msg:
          guest: "{{ opnsense_guest }}"
          management: "{{ hostvars[opnsense_guest].ansible_host }}"
          changes: "{{ (pilot_preview.stdout | trim | from_json).changes }}"
          wan: Connect the owned WAN vNIC only after saved configuration and loaded firewall and DNS checks pass
          home: "{{ (pilot_preview.stdout | trim | from_json).home_pilot }}"
          scope: "{{ 'MGMT services and isolated HOME DHCP/DNS/internet; DEV/BMC stay disabled' if (pilot_preview.stdout | trim | from_json).home_pilot is not none else 'MGMT services; HOME/DEV/BMC stay disabled and no DHCP server is enabled' }}"

    - name: Preview firewall and DNS with the community modules
      ansible.builtin.include_tasks:
        file: tasks/configure-opnsense-policy.yml
        apply:
          check_mode: true
      vars:
        pilot_reload_required: false
        pilot_policy_preview: true

    - name: Select whether the API preview requires a configuration transaction
      ansible.builtin.set_fact:
        pilot_api_change: "{{ pilot_rule_changes.changed or pilot_bootstrap_change.changed | default(false) or pilot_dns_general_change.changed or pilot_dns_acl_changes.changed or pilot_dns_host_changes.changed or pilot_dhcp_general_change.changed | default(false) or pilot_dhcp_subnet_change.changed | default(false) }}"

    - name: Finish the read-only preview before guest or VM writes
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Save validated pilot settings and a protected pre-change backup
      ansible.builtin.raw: "{{ pilot_prefix }} apply {{ pilot_payload | to_json | b64encode | quote }} {{ 'api-change' if pilot_api_change else 'no-api-change' }}"
      delegate_to: "{{ opnsense_guest }}"
      register: pilot_apply
      changed_when: pilot_apply.rc == 0 and (pilot_apply.stdout | trim | from_json).changed

    - name: Select whether pending runtime configuration needs applying
      ansible.builtin.set_fact:
        pilot_reload_required: "{{ (pilot_apply.stdout | trim | from_json).reload_required }}"

    - name: Read the private pre-change backup without displaying it
      ansible.builtin.raw: "/usr/bin/base64 {{ (pilot_apply.stdout | trim | from_json).backup | quote }}"
      delegate_to: "{{ opnsense_guest }}"
      register: pilot_backup_bytes
      changed_when: false
      no_log: true
      when: pilot_reload_required

    - name: Create the protected controller backup parent
      ansible.builtin.file:
        path: "{{ inventory_dir }}/backups"
        state: directory
        mode: '0700'
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: pilot_reload_required

    - name: Allocate a private controller backup directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ inventory_dir }}/backups"
        prefix: "{{ opnsense_guest }}-pilot-"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pilot_backup_directory
      when: pilot_reload_required

    - name: Export the exact pre-change configuration privately
      ansible.builtin.copy:
        dest: "{{ pilot_backup_directory.path }}/before.xml"
        content: "{{ pilot_backup_bytes.stdout | b64decode }}"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      diff: false
      no_log: true
      when: pilot_reload_required

    - name: Apply firewall, DNS and selected DHCP through OXL
      ansible.builtin.include_tasks: tasks/configure-opnsense-policy.yml

    - name: Apply native time and resolver settings
      ansible.builtin.raw: "{{ item }}"
      loop:
        - /usr/local/sbin/pluginctl -s ntpd restart
        - /usr/local/bin/php -r 'require_once("config.inc"); require_once("util.inc"); require_once("system.inc"); system_resolvconf_generate();'
      delegate_to: "{{ opnsense_guest }}"
      changed_when: true
      when: pilot_reload_required

    - name: Verify saved settings and loaded rules, DNS records and time service
      ansible.builtin.raw: "{{ pilot_prefix }} verify {{ pilot_payload | to_json | b64encode | quote }}"
      delegate_to: "{{ opnsense_guest }}"
      register: pilot_runtime
      changed_when: false
      retries: 12
      delay: 5
      until: pilot_runtime is succeeded

    - name: Record successfully applied management services
      ansible.builtin.raw: "{{ pilot_prefix }} complete {{ pilot_payload | to_json | b64encode | quote }}"
      delegate_to: "{{ opnsense_guest }}"
      changed_when: pilot_reload_required

    - name: Recheck current and pending VM hardware and running state before WAN attachment
      community.proxmox.proxmox_vm_info:
        vmid: "{{ opnsense_vm.vmid }}"
        config: "{{ item }}"
        network: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pilot_host
      loop: [current, pending]

    - name: Refuse concurrent pending changes or a stopped VM
      ansible.builtin.assert:
        that:
          - pilot_host.results[0].proxmox_vms[0].config == pilot_host.results[1].proxmox_vms[0].config
          - pilot_host.results[0].proxmox_vms[0].status == 'running'

    - name: Validate unchanged owned VM hardware before changing only the WAN link
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/validate-opnsense-vm.py"]
        stdin: "{{ {'config': pilot_host.results[0].proxmox_vms[0].config, 'desired': opnsense_expected} | to_json }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pilot_wan_validation
      changed_when: false

    - name: Connect only the verified owned WAN vNIC to the existing Fortinet pilot
      community.proxmox.proxmox_nic:
        vmid: "{{ opnsense_vm.vmid }}"
        interface: net0
        model: virtio
        mac: "{{ opnsense_vm.networks[0].mac }}"
        bridge: "{{ opnsense_vm.networks[0].bridge }}"
        firewall: false
        link_down: "{{ not opnsense_vm.wan_connected }}"
        state: present
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: (pilot_wan_validation.stdout | from_json).wan_link_change

    - name: Read current VM hardware after the WAN link transition
      community.proxmox.proxmox_vm_info:
        vmid: "{{ opnsense_vm.vmid }}"
        config: current
        network: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pilot_final_hardware

    - name: Verify the exact requested WAN state and preserved VM hardware
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/validate-opnsense-vm.py"]
        stdin: "{{ {'config': pilot_final_hardware.proxmox_vms[0].config, 'desired': opnsense_expected} | to_json }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: pilot_final_validation
      changed_when: false
      failed_when: pilot_final_validation.rc != 0 or (pilot_final_validation.stdout | from_json).wan_link_change

    - name: Verify the private WAN DHCP lease and intended gateway
      ansible.builtin.raw: "{{ pilot_prefix }} network {{ pilot_payload | to_json | b64encode | quote }}"
      delegate_to: "{{ opnsense_guest }}"
      register: pilot_network
      changed_when: false
      retries: 36
      delay: 5
      until: pilot_network is succeeded

    - name: Verify Proxmox DNS, NAT and outbound HTTPS through management
      ansible.builtin.uri:
        url: https://enterprise.proxmox.com/
        validate_certs: true
        use_proxy: false
        status_code: [200, 401]
        timeout: 30
      register: pilot_https
      retries: 6
      delay: 5
      until: pilot_https is succeeded

    - name: Report pilot access and backup location without configuration secrets
      ansible.builtin.debug:
        msg:
          management: "{{ hostvars[opnsense_guest].ansible_host }}"
          wan_address: "{{ (pilot_network.stdout | trim | from_json).wan_address }}"
          ntp_synchronized: "{{ (pilot_network.stdout | trim | from_json).ntp_synchronized }}"
          backup: "{{ pilot_backup_directory.path if pilot_reload_required else 'Existing protected guest backup retained; no new configuration save' }}"
          home: "{{ (pilot_network.stdout | trim | from_json).home_pilot }}"
