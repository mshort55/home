---
- name: Verify the isolated desired UniFi site configuration
  hosts: unifi_hosts
  gather_facts: false
  become: true
  vars_files:
  - "{{ vault_file | default(((playbook_dir ~ '/..') | realpath) ~ '/secrets/vault.yml') }}"
  roles:
  - role: unifi_site
    unifi_site_options: {task_action: verify}
    unifi_site_credentials: >-
      {{ {'api_key': vault_devices[inventory_hostname].api_key,
          'ssid': vault_devices[inventory_hostname].ssid | default(''),
          'passphrase': vault_devices[inventory_hostname].passphrase | default('')} }}
