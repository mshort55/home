---
- name: Prepare a protected controller API export destination
  delegate_to: localhost
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    enrollment_directory: "{{ inventory_dir }}/.cache/community-api/{{ inventory_hostname }}"
  block:
    - name: Inspect existing controller API export paths
      ansible.builtin.stat:
        path: "{{ enrollment_directory }}{{ item }}"
        follow: false
      loop: ['', /credentials.json, /ca.pem]
      register: enrollment_paths
      no_log: true

    - name: Refuse symlinks or unprotected existing enrollment artifacts
      ansible.builtin.assert:
        that:
          - not item.stat.exists or not item.stat.islnk | default(false)
          - not item.stat.exists or (item.stat.isdir | default(false) if item.item == '' else item.stat.isreg | default(false))
          - not item.stat.exists or item.stat.mode == ('0700' if item.item == '' else '0600')
      loop: "{{ enrollment_paths.results }}"
      no_log: true

    - name: Create the private controller enrollment directory
      ansible.builtin.file:
        path: "{{ enrollment_directory }}"
        state: directory
        mode: '0700'
      when: not ansible_check_mode
