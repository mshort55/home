---
- name: Stage verified installation media and create the stopped OPNsense VM
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  vars:
    opnsense_iso_cache: "{{ inventory_dir }}/.cache/iso/opnsense-{{ opnsense_release.version }}"
    opnsense_iso_volume: "{{ opnsense_vm.iso_storage }}:iso/{{ opnsense_release.filename }}"
    opnsense_owner_marker: "Managed by create-opnsense-vm.yml; vmid={{ opnsense_vm.vmid }}"
  vars_files:
    - ../files/opnsense/release.yml
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ pve_api.api_host }}"
      api_user: "{{ pve_api.api_user }}"
      api_token_id: "{{ pve_api.api_token_id }}"
      api_token_secret: "{{ pve_api.api_token_secret }}"
      validate_certs: true
      ca_path: "{{ inventory_dir }}/.cache/community-api/{{ inventory_hostname }}/ca.pem"
      api_timeout: 30
  tasks:
    - name: Load the enrolled Proxmox API
      ansible.builtin.include_tasks: tasks/load-community-api.yml
      vars:
        community_api_host: "{{ inventory_hostname }}"
        community_api_var: pve_api

    - name: Read VM allocations using the community API
      community.proxmox.proxmox_vm_info:
        vmid: "{{ opnsense_vm.vmid }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: opnsense_vm_allocations

    - name: Validate the bounded firewall VM allocation
      ansible.builtin.assert:
        that:
          - ansible_user == 'root'
          - opnsense_vm is mapping
          - opnsense_vm.vmid == 100
          - opnsense_vm.name is match('^[A-Za-z][A-Za-z0-9-]{0,62}$')
          - opnsense_vm.cores == 4
          - opnsense_vm.memory_mib == 8192
          - opnsense_vm.disk_gib == 32
          - opnsense_vm.disk_storage is match('^[A-Za-z][A-Za-z0-9_-]*$')
          - opnsense_vm.iso_storage is match('^[A-Za-z][A-Za-z0-9_-]*$')
          - opnsense_vm.onboot is boolean
          - opnsense_vm.wan_connected is boolean
          - opnsense_vm.networks | length == 5
          - opnsense_vm.networks | map(attribute='device') | list == ['net0', 'net1', 'net2', 'net3', 'net4']
          - opnsense_vm.networks | map(attribute='role') | list == ['WAN', 'MGMT', 'HOME', 'DEV', 'BMC']
          - opnsense_vm.networks | map(attribute='mac') | unique | length == 5
          - opnsense_verify_only | default(false) is boolean
          - opnsense_verify_wan_state | default(true) is boolean
        fail_msg: Define the documented VM 100 allocation and five ordered MAC-to-role mappings.

    - name: Validate explicit guest network isolation
      ansible.builtin.assert:
        that:
          - item.mac is match('^02:(?:[0-9a-f]{2}:){4}[0-9a-f]{2}$')
          - item.bridge in (proxmox_network.guest_bridges | map(attribute='name') | list)
          - item.bridge == role_bridge
          - item.tag | default(0) == role_tag
          - item.role == 'WAN' or role_tag in (proxmox_network.guest_bridges | selectattr('vlan_aware', 'equalto', true) | first).vlans
        fail_msg: WAN must be untagged on the plain bridge; internal roles require their individual VLAN tags on the VLAN-aware bridge.
      loop: "{{ opnsense_vm.networks }}"
      loop_control:
        label: "{{ item.device }} {{ item.role }}"
      vars:
        role_bridge: "{{ (proxmox_network.guest_bridges | selectattr('vlan_aware', 'equalto', item.role != 'WAN') | first).name }}"
        role_tag: "{{ {'WAN': 0, 'MGMT': 10, 'HOME': 20, 'DEV': 30, 'BMC': 40}[item.role] }}"

    - name: Inspect the verified controller ISO and completion manifest
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ opnsense_iso_cache }}/{{ opnsense_release.filename }}"
        - "{{ opnsense_iso_cache }}/completion.json"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: opnsense_local_files

    - name: Require previously verified nonsymlink local media
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.size | default(0) > 0
        fail_msg: Run prepare-opnsense-iso.yml successfully on this controller first.
      loop: "{{ opnsense_local_files.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Read the controller ISO verification manifest
      ansible.builtin.slurp:
        src: "{{ opnsense_iso_cache }}/completion.json"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: opnsense_manifest_file

    - name: Decode the ISO verification manifest
      ansible.builtin.set_fact:
        opnsense_manifest: "{{ opnsense_manifest_file.content | b64decode | from_json }}"

    - name: Require the pinned release and exact verified image bytes
      ansible.builtin.assert:
        that:
          - opnsense_manifest.schema_version == 1
          - opnsense_manifest.version == opnsense_release.version
          - opnsense_manifest.filename == opnsense_release.filename
          - opnsense_manifest.signature_verified is sameas true
          - opnsense_manifest.archive_sha256 == opnsense_release.archive_sha256
          - opnsense_manifest.public_key_sha256 == opnsense_release.public_key_sha256
          - opnsense_manifest.iso_sha256 == opnsense_local_files.results[0].stat.checksum
          - opnsense_manifest.iso_size == opnsense_local_files.results[0].stat.size

    - name: Read host identity, storage, VM allocations and live networking
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [hostname, -s]
        - [pvesh, get, /nodes/localhost/storage, --output-format, json]
        - [ip, -j, -d, address, show]
        - [ifquery, --check, vmbr0, vmbr1, vmbr2]
        - "{{ ['pvesm', 'list', opnsense_vm.disk_storage, '--vmid', opnsense_vm.vmid | string] }}"
        - "{{ ['pvesm', 'path', opnsense_iso_volume] }}"
        - [bridge, -j, vlan, show]
      register: opnsense_host_reads
      changed_when: false
      check_mode: false

    - name: Decode the host resources
      ansible.builtin.set_fact:
        opnsense_host_name: "{{ opnsense_host_reads.results[0].stdout }}"
        opnsense_storage: "{{ opnsense_host_reads.results[1].stdout | from_json }}"
        opnsense_allocations: "{{ opnsense_vm_allocations.proxmox_vms }}"
        opnsense_live_links: "{{ opnsense_host_reads.results[2].stdout | from_json }}"
        opnsense_remote_iso: "{{ opnsense_host_reads.results[5].stdout }}"
        opnsense_live_vlans: "{{ opnsense_host_reads.results[6].stdout | from_json }}"

    - name: Inspect the destination ISO without changing it
      ansible.builtin.stat:
        path: "{{ opnsense_remote_iso }}"
        follow: false
        checksum_algorithm: sha256
      register: opnsense_remote_media

    - name: Require available local storage and an unused or correctly located QEMU VM ID
      ansible.builtin.assert:
        that:
          - disk_storage | length == 1
          - disk_storage[0].type == 'lvmthin'
          - disk_storage[0].active == 1 and disk_storage[0].enabled == 1
          - '"images" in disk_storage[0].content.split(",")'
          - iso_storage | length == 1
          - iso_storage[0].type == 'dir'
          - iso_storage[0].active == 1 and iso_storage[0].enabled == 1
          - '"iso" in iso_storage[0].content.split(",")'
          - opnsense_remote_media.stat.exists or iso_storage[0].avail > opnsense_manifest.iso_size * 2
          - opnsense_allocations | length <= 1
          - not opnsense_verify_only | default(false) or opnsense_allocations | length == 1
          - opnsense_allocations | length == 0 or (opnsense_allocations[0].type == 'qemu' and opnsense_allocations[0].node == opnsense_host_name)
          - opnsense_allocations | length != 0 or opnsense_host_reads.results[4].stdout_lines | length == 1
          - opnsense_allocations | length != 0 or disk_storage[0].avail > (opnsense_vm.disk_gib + 1) * 1024 ** 3
          - opnsense_remote_iso.startswith('/')
          - opnsense_allocations | length != 0 or not opnsense_vm.wan_connected
        fail_msg: Storage, VM placement or orphaned VM-100 volumes need review before this bootstrap can proceed.
      vars:
        disk_storage: "{{ opnsense_storage | selectattr('storage', 'equalto', opnsense_vm.disk_storage) | list }}"
        iso_storage: "{{ opnsense_storage | selectattr('storage', 'equalto', opnsense_vm.iso_storage) | list }}"

    - name: Require running data bridges with no host addresses
      ansible.builtin.assert:
        that:
          - bridge_link | length == 1
          - bridge_link[0].linkinfo.info_kind == 'bridge'
          - '"UP" in bridge_link[0].flags'
          - bridge_link[0].linkinfo.info_data.vlan_filtering == (1 if item.vlan_aware else 0)
          - bridge_link[0].addr_info | length == 0
          - physical_link | length == 1
          - physical_link[0].master | default('') == item.name
          - physical_link[0].address == item.mac
          - physical_link[0].addr_info | length == 0
          - not item.vlan_aware or port_vlans | length == 1
          - not item.vlan_aware or item.vlans | difference(port_vlan_ids) | length == 0
          - not item.vlan_aware or port_vlan_ids | difference([1] + item.vlans) | length == 0
      loop: "{{ proxmox_network.guest_bridges }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        bridge_link: "{{ opnsense_live_links | selectattr('ifname', 'equalto', item.name) | list }}"
        physical_link: "{{ opnsense_live_links | selectattr('ifname', 'equalto', item.port) | list }}"
        port_vlans: "{{ opnsense_live_vlans | selectattr('ifname', 'equalto', item.port) | list }}"
        port_vlan_ids: "{{ (port_vlans | first).vlans | map(attribute='vlan') | list }}"

    - name: Build the desired VM hardware
      ansible.builtin.set_fact:
        opnsense_expected:
          vmid: "{{ opnsense_vm.vmid }}"
          name: "{{ opnsense_vm.name }}"
          description: "{{ opnsense_owner_marker }}"
          bios: ovmf
          machine: q35
          ostype: other
          scsihw: virtio-scsi-single
          cores: "{{ opnsense_vm.cores }}"
          sockets: 1
          memory: "{{ opnsense_vm.memory_mib }}"
          balloon: 0
          numa: 0
          onboot: "{{ opnsense_vm.onboot | int }}"
          disk_gib: "{{ opnsense_vm.disk_gib }}"
          disk_storage: "{{ opnsense_vm.disk_storage }}"
          iso_volume: "{{ opnsense_iso_volume }}"
          bootstrap_iso_volume: "{{ opnsense_vm.iso_storage }}:iso/OPNsense-{{ opnsense_release.version }}-bootstrap-{{ inventory_hostname }}.iso"
          networks: {}
        opnsense_create_networks: {}

    - name: Add stable individually scoped VirtIO network definitions
      ansible.builtin.set_fact:
        opnsense_expected: "{{ opnsense_expected | combine({'networks': opnsense_expected.networks | combine({item.device: network_properties})}) }}"
        opnsense_create_networks: "{{ opnsense_create_networks | combine({item.device: network_argument}) }}"
      loop: "{{ opnsense_vm.networks }}"
      loop_control:
        label: "{{ item.device }} {{ item.role }}"
      vars:
        network_properties: "{{ {'model': 'virtio', 'macaddr': item.mac, 'bridge': item.bridge, 'firewall': '0'} | combine({'tag': item.tag | string} if item.role != 'WAN' else {'link_down': (not opnsense_vm.wan_connected) | int | string}) }}"
        network_argument: "{{ 'virtio=' + item.mac + ',bridge=' + item.bridge + ',firewall=0' + (',tag=' + (item.tag | string) if item.role != 'WAN' else ',link_down=' + ((not opnsense_vm.wan_connected) | int | string)) }}"

    - name: Select the desired WAN connection argument
      ansible.builtin.set_fact:
        opnsense_wan_argument: "{{ opnsense_create_networks.net0 }}"

    - name: Read current and pending VM configuration through the API
      community.proxmox.proxmox_vm_info:
        vmid: "{{ opnsense_vm.vmid }}"
        config: "{{ item }}"
        network: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: opnsense_existing_vm
      loop: [current, pending]
      when: opnsense_allocations | length == 1

    - name: Refuse pending configuration changes on an existing VM
      ansible.builtin.assert:
        that:
          - opnsense_existing_vm.results[0].proxmox_vms[0].config == opnsense_existing_vm.results[1].proxmox_vms[0].config
        fail_msg: Reconcile the existing VM's pending configuration before this workflow.
      when: opnsense_allocations | length == 1

    - name: Refuse an existing VM with conflicting ownership or hardware
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/validate-opnsense-vm.py"]
        stdin: "{{ {'config': opnsense_existing_vm.results[0].proxmox_vms[0].config, 'desired': opnsense_expected} | to_json }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      check_mode: false
      register: opnsense_existing_verification
      when: opnsense_allocations | length == 1

    - name: Determine whether an existing WAN link needs changing
      ansible.builtin.set_fact:
        opnsense_wan_change: "{{ opnsense_allocations | length == 1 and (opnsense_existing_verification.stdout | from_json).wan_link_change }}"

    - name: Require a matching WAN state during verification-only use
      ansible.builtin.assert:
        that:
          - not opnsense_wan_change
      when: opnsense_verify_only | default(false) and opnsense_verify_wan_state | default(true)

    - name: Require console interface assignment confirmation before connecting WAN
      ansible.builtin.assert:
        that:
          - opnsense_wan_assignment_confirmed | default(false) is sameas true
        fail_msg: Confirm the guest WAN/MGMT MAC assignment before connecting the pilot WAN; pass opnsense_wan_assignment_confirmed as boolean true using the documented JSON extra variables.
      when: opnsense_wan_change and opnsense_vm.wan_connected and not opnsense_verify_only | default(false)

    - name: Refuse a conflicting or symlink ISO destination
      ansible.builtin.assert:
        that:
          - not opnsense_remote_media.stat.exists or (opnsense_remote_media.stat.isreg | default(false) and not opnsense_remote_media.stat.islnk | default(false) and opnsense_remote_media.stat.checksum | default('') == opnsense_manifest.iso_sha256)
        fail_msg: The named ISO destination already contains different bytes or is not a regular file.

    - name: Stage the verified ISO through the community API
      community.proxmox.proxmox_template:
        node: "{{ pve_api.node }}"
        storage: "{{ opnsense_vm.iso_storage }}"
        content_type: iso
        src: "{{ opnsense_iso_cache }}/{{ opnsense_release.filename }}"
        force: false
        timeout: 600
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: not ansible_check_mode and not opnsense_verify_only | default(false)

    - name: Verify the staged ISO before VM creation
      ansible.builtin.stat:
        path: "{{ opnsense_remote_iso }}"
        checksum_algorithm: sha256
      register: opnsense_staged_iso
      when: not ansible_check_mode and not opnsense_verify_only | default(false)

    - name: Require exact staged ISO bytes
      ansible.builtin.assert:
        that:
          - opnsense_staged_iso.stat.checksum == opnsense_manifest.iso_sha256
          - opnsense_staged_iso.stat.size == opnsense_manifest.iso_size
      when: not ansible_check_mode and not opnsense_verify_only | default(false)

    - name: Preview creation without allocating disks or starting the VM
      ansible.builtin.debug:
        msg: "{{ {'create': opnsense_expected, 'net': opnsense_create_networks} if opnsense_allocations | length == 0 else {'WAN link change': opnsense_wan_change} }}"
      changed_when: opnsense_allocations | length == 0 or opnsense_wan_change
      when: ansible_check_mode and not opnsense_verify_only | default(false)

    - name: Create the VM once without starting it
      community.proxmox.proxmox_kvm:
        node: "{{ pve_api.node }}"
        vmid: "{{ opnsense_vm.vmid }}"
        name: "{{ opnsense_vm.name }}"
        description: "{{ opnsense_owner_marker }}"
        state: present
        update: false
        bios: ovmf
        machine: q35
        ostype: other
        cpu: host
        cores: "{{ opnsense_vm.cores }}"
        sockets: 1
        memory: "{{ opnsense_vm.memory_mib }}"
        balloon: 0
        numa_enabled: false
        agent: '0'
        vga: std
        onboot: "{{ opnsense_vm.onboot }}"
        startup: order=1,up=30,down=120
        scsihw: virtio-scsi-single
        scsi:
          scsi0: "{{ opnsense_vm.disk_storage }}:{{ opnsense_vm.disk_gib }},cache=none,iothread=1"
        efidisk0:
          storage: "{{ opnsense_vm.disk_storage }}"
          efitype: 4m
          pre_enrolled_keys: false
          format: raw
        ide:
          ide2: "{{ opnsense_iso_volume }},media=cdrom"
        boot: order=scsi0;ide2
        net: "{{ opnsense_create_networks }}"
        timeout: 300
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: opnsense_allocations | length == 0 and not ansible_check_mode and not opnsense_verify_only | default(false)

    - name: Apply only the requested WAN link transition on an existing VM
      community.proxmox.proxmox_nic:
        vmid: "{{ opnsense_vm.vmid }}"
        interface: net0
        model: virtio
        mac: "{{ opnsense_vm.networks[0].mac }}"
        bridge: "{{ opnsense_vm.networks[0].bridge }}"
        firewall: false
        link_down: "{{ not opnsense_vm.wan_connected }}"
        state: present
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: opnsense_wan_change and not opnsense_verify_only | default(false)

    - name: Read final VM configuration and power state
      community.proxmox.proxmox_vm_info:
        vmid: "{{ opnsense_vm.vmid }}"
        config: current
        network: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: opnsense_final_reads
      when: not ansible_check_mode

    - name: Verify final VM hardware
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/validate-opnsense-vm.py"]
        stdin: "{{ {'config': opnsense_final_reads.proxmox_vms[0].config, 'desired': opnsense_expected} | to_json }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      register: opnsense_final_verification
      when: not ansible_check_mode

    - name: Verify the requested WAN link state
      ansible.builtin.assert:
        that:
          - not (opnsense_final_verification.stdout | from_json).wan_link_change
      when: not ansible_check_mode and (not opnsense_verify_only | default(false) or opnsense_verify_wan_state | default(true))

    - name: Require a newly created VM to remain stopped
      ansible.builtin.assert:
        that:
          - opnsense_final_reads.proxmox_vms[0].status == 'stopped'
      when: opnsense_allocations | length == 0 and not ansible_check_mode

    - name: Report the VM preparation and stable interface mapping
      ansible.builtin.debug:
        msg:
          operation: "{{ 'Preview only' if ansible_check_mode else 'VM hardware verified; no start, stop or installation requested' }}"
          vmid: "{{ opnsense_vm.vmid }}"
          networks: "{{ opnsense_vm.networks }}"
