---
- name: Manage a read-only ISO on iDRAC virtual DVD media
  hosts: idracs
  connection: local
  gather_facts: false
  become: false
  serial: 1
  vars:
    vault_file: "{{ playbook_dir }}/../secrets/vault.yml"
    backup_root: "{{ playbook_dir }}/../backups"
    idrac_iso_operation: mount
    idrac_iso_source: local
    idrac_iso_manage_hosts: true
    idrac_iso_port: 8080
    iso_manager_path: /redfish/v1/Managers/iDRAC.Embedded.1
    iso_identity_path: /redfish/v1/Managers/iDRAC.Embedded.1/EthernetInterfaces/iDRAC.Embedded.1%23NIC.1
    iso_media_path: /redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/CD
    iso_server_directory: "{{ playbook_dir }}/../.cache/iso-server/{{ inventory_hostname }}"
    iso_server_label: "local.home-automation.iso.{{ inventory_hostname }}"
    iso_requested_url: >-
      {{ 'http://' ~ idrac_iso_bind_address ~ ':' ~ (idrac_iso_port | string) ~ '/' ~
         (idrac_iso_path | basename | urlencode) if idrac_iso_source == 'local'
         else idrac_iso_url }}
  vars_files:
    - "{{ vault_file }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ vault_devices[inventory_hostname].username }}"
      url_password: "{{ vault_devices[inventory_hostname].password }}"
      force_basic_auth: true
      validate_certs: true
      ca_path: "{{ idrac_ca_path }}"
      ciphers: "{{ idrac_tls_ciphers | default(omit) }}"
      follow_redirects: none
      use_proxy: false
      return_content: true
      timeout: 30
  tasks:
    - name: Validate operation and device identity inputs
      ansible.builtin.assert:
        that:
          - idrac_iso_operation in ['mount', 'eject', 'status']
          - idrac_iso_source in ['local', 'url']
          - inventory_hostname is match('^[A-Za-z0-9_-]+$')
          - idrac_expected_mac is defined
          - idrac_expected_mac is match('^(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
        fail_msg: Supply an expected iDRAC MAC and a supported operation/source.

    - name: Validate local image hosting inputs
      ansible.builtin.assert:
        that:
          - idrac_iso_path is defined
          - idrac_iso_path is string
          - idrac_iso_path.startswith('/')
          - idrac_iso_path | basename is match('^[A-Za-z0-9_.-]+[.]iso$')
          - idrac_iso_sha256 is defined
          - idrac_iso_sha256 is match('^[0-9a-f]{64}$')
          - idrac_iso_bind_address is defined
          - idrac_iso_bind_address is match('^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$')
          - idrac_network.address is defined
          - idrac_iso_port is integer
          - idrac_iso_port >= 1024 and idrac_iso_port <= 65535
        fail_msg: Local hosting needs an absolute native Mac ISO path, SHA-256, Ethernet IPv4 address and port.
      when: idrac_iso_source == 'local' and idrac_iso_operation != 'status'

    - name: Validate the requested image URL before device access
      ansible.builtin.assert:
        that:
          - iso_requested_url is string
          - iso_requested_url | length <= 4096
          - iso_requested_url is not search('[\s\x00-\x1f\x7f]')
          - iso_requested_url | urlsplit('scheme') in ['http', 'https']
          - iso_requested_url | urlsplit('hostname') | length > 0
          - iso_requested_url | urlsplit('username') is none
          - iso_requested_url | urlsplit('password') is none
          - iso_requested_url | urlsplit('query') == ''
          - iso_requested_url | urlsplit('fragment') == ''
          - iso_requested_url | urlsplit('path') is search('(?i)[.]iso$')
          - iso_requested_url | urlsplit('port') is none or 1 <= (iso_requested_url | urlsplit('port')) <= 65535
        fail_msg: Supply a credential-free HTTP(S) ISO URL without query parameters or fragments.
      when: idrac_iso_operation != 'status'
      no_log: true

    - name: Prepare the native Mac platform and iDRAC hostname mapping
      ansible.builtin.include_tasks: tasks/prepare-iso-host.yml
      when: idrac_iso_source == 'local'

    - name: Read manager, dedicated interface identity and virtual DVD
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ item }}"
        status_code: 200
      loop: "{{ [iso_manager_path, iso_identity_path, iso_media_path] }}"
      register: iso_before
      check_mode: false
      no_log: true

    - name: Require the expected iDRAC and advertised DVD resource
      ansible.builtin.assert:
        that:
          - iso_before.results[0].json.VirtualMedia['@odata.id'] == iso_manager_path ~ '/VirtualMedia'
          - iso_before.results[1].json.MACAddress | lower == idrac_expected_mac | lower
          - iso_before.results[2].json['@odata.id'] == iso_media_path
          - iso_before.results[2].json.Inserted is boolean
          - "'CD' in iso_before.results[2].json.MediaTypes or 'DVD' in iso_before.results[2].json.MediaTypes"
        fail_msg: Device identity or virtual DVD resource does not match the inventory.
      no_log: true

    - name: Report current virtual DVD state
      ansible.builtin.debug:
        msg:
          inserted: "{{ iso_before.results[2].json.Inserted }}"
          connected_via: "{{ iso_before.results[2].json.ConnectedVia | default('Unknown') }}"
          write_protected: "{{ iso_before.results[2].json.WriteProtected | default(none) }}"
      when: idrac_iso_operation == 'status'

    - name: Finish a read-only status operation
      ansible.builtin.meta: end_host
      when: idrac_iso_operation == 'status'

    - name: Refuse unrelated or inconsistent attached media
      ansible.builtin.assert:
        that:
          - not iso_before.results[2].json.Inserted or iso_before.results[2].json.Image == iso_requested_url
          - iso_before.results[2].json.Inserted or iso_before.results[2].json.ConnectedVia == 'NotConnected'
          - idrac_iso_operation != 'mount' or not iso_before.results[2].json.Inserted or iso_before.results[2].json.WriteProtected is sameas true
          - iso_before.results[2].json.Actions['#VirtualMedia.InsertMedia'].target == iso_media_path ~ '/Actions/VirtualMedia.InsertMedia'
          - iso_before.results[2].json.Actions['#VirtualMedia.EjectMedia'].target == iso_media_path ~ '/Actions/VirtualMedia.EjectMedia'
        fail_msg: Another image or console session is attached, or action paths are unexpected. Inspect the DVD before proceeding.
      no_log: true

    - name: Determine whether a media action is needed
      ansible.builtin.set_fact:
        iso_media_change_needed: "{{ not iso_before.results[2].json.Inserted if idrac_iso_operation == 'mount' else iso_before.results[2].json.Inserted }}"

    - name: Preview media and hosting operations without writes
      ansible.builtin.debug:
        msg:
          operation: "{{ idrac_iso_operation }}"
          media_action_needed: "{{ iso_media_change_needed }}"
          local_hosting: "{{ idrac_iso_source == 'local' }}"
          scope: Preview reads iDRAC only; local hosting and bootability are not verified.
      changed_when: iso_media_change_needed
      when: ansible_check_mode

    - name: Finish the check-mode preview
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Start and verify native Mac image hosting
      ansible.builtin.include_tasks: tasks/start-iso-server.yml
      when: idrac_iso_source == 'local' and idrac_iso_operation == 'mount'

    - name: Perform and verify one media action
      when: iso_media_change_needed
      block:
        - name: Create private media record parent
          ansible.builtin.file:
            path: "{{ backup_root }}"
            state: directory
            mode: '0700'

        - name: Allocate a unique media operation directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ backup_root }}"
            prefix: "{{ inventory_hostname }}-iso-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-"
          register: iso_directory

        - name: Save the original media response and operation intent
          ansible.builtin.copy:
            dest: "{{ iso_directory.path }}/before.json"
            mode: '0600'
            content: "{{ {'media': iso_before.results[2].json, 'operation': idrac_iso_operation, 'image': iso_requested_url, 'submission': 'not_started'} | to_nice_json }}\n"
          no_log: true
          diff: false

        - name: Report the private recovery record location
          ansible.builtin.debug:
            msg: "Media operation records: {{ iso_directory.path }}"

        - name: Submit the media action once and read back its state
          block:
            - name: Submit the advertised insert or eject action once
              ansible.builtin.uri:
                url: "https://{{ ansible_host }}{{ iso_media_path }}/Actions/VirtualMedia.{{ 'InsertMedia' if idrac_iso_operation == 'mount' else 'EjectMedia' }}"
                method: POST
                body_format: json
                body: "{{ {'Image': iso_requested_url, 'Inserted': true, 'WriteProtected': true} if idrac_iso_operation == 'mount' else {} }}"
                status_code: [200, 202, 204]
              register: iso_submission
              changed_when: true
              no_log: true

            - name: Wait for the requested media state
              ansible.builtin.uri:
                url: "https://{{ ansible_host }}{{ iso_media_path }}"
                status_code: 200
              register: iso_after
              until: >-
                iso_after.status | default(0) != 200 or
                ((iso_after.json | default({})).get('Inserted') is sameas false
                 if idrac_iso_operation == 'eject' else
                 ((iso_after.json | default({})).get('Inserted') is sameas true and
                  (iso_after.json | default({})).get('Image') == iso_requested_url and
                  (iso_after.json | default({})).get('WriteProtected') is sameas true))
              retries: 12
              delay: 5
              no_log: true

            - name: Require verified final virtual DVD state
              ansible.builtin.assert:
                that:
                  - iso_after.json['@odata.id'] == iso_media_path
                  - iso_after.json.Inserted is sameas false if idrac_iso_operation == 'eject' else iso_after.json.Inserted is sameas true
                  - idrac_iso_operation != 'mount' or iso_after.json.Image == iso_requested_url
                  - idrac_iso_operation != 'mount' or iso_after.json.WriteProtected is sameas true
              no_log: true
          always:
            - name: Preserve response bodies without request credentials
              ansible.builtin.copy:
                dest: "{{ iso_directory.path }}/result.json"
                mode: '0600'
                content: >-
                  {{ {'submission_http_status': iso_submission.status | default(0),
                      'submission_body': iso_submission.json | default({}),
                      'media_http_status': iso_after.status | default(0),
                      'media_body': iso_after.json | default({})} | to_nice_json }}
              no_log: true
              diff: false

        - name: Record verified media operation completion
          ansible.builtin.copy:
            dest: "{{ iso_directory.path }}/completion.json"
            mode: '0600'
            content: "{{ {'operation': idrac_iso_operation, 'image': iso_requested_url, 'verified': true, 'boot_settings_changed': false, 'host_restarted': false} | to_nice_json }}\n"
          no_log: true
          diff: false

    - name: Stop native Mac hosting after successful ejection
      ansible.builtin.include_tasks: tasks/stop-iso-server.yml
      when: idrac_iso_source == 'local' and idrac_iso_operation == 'eject'

    - name: Report the verified media state
      ansible.builtin.debug:
        msg: "{{ 'Read-only ISO is mounted. Keep its source server running while booting or installing.' if idrac_iso_operation == 'mount' else 'ISO is ejected; local hosting is stopped when managed by this workflow.' }}"
