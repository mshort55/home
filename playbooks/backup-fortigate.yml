---
- name: Export the complete FortiGate configuration without changing settings
  hosts: fortigates
  gather_facts: false
  become: false
  serial: 1
  vars:
    backup_root: "{{ playbook_dir }}/../backups"
    vault_file: "{{ playbook_dir }}/../secrets/vault.yml"
  vars_files:
    - "{{ vault_file }}"

  tasks:
    - name: Require a real collection run
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use --syntax-check for offline validation; a backup requires a normal run.

    - name: Require HTTPS with certificate validation and connection logging disabled
      ansible.builtin.assert:
        that:
          - ansible_connection == 'ansible.netcommon.httpapi'
          - ansible_network_os == 'fortinet.fortios.fortios'
          - ansible_httpapi_use_ssl | bool
          - ansible_httpapi_validate_certs | bool
          - not (ansible_persistent_log_messages | default(false) | bool)
        fail_msg: Configure the documented verified HTTPS connection before collecting credentials or configuration.

    - name: Collect a global configuration export in an authenticated session
      block:
        - name: Read the device configuration backup endpoint
          fortinet.fortios.fortios_monitor_fact:
            vdom: root
            enable_log: false
            selector: system_config_backup
            params:
              scope: global
          register: fortigate_export
          changed_when: false
          no_log: true
      always:
        - name: Close the persistent session after collection
          ansible.builtin.meta: reset_connection
          no_log: true

    - name: Require a successful unmasked FortiOS configuration response
      ansible.builtin.assert:
        that:
          - fortigate_export.meta.http_status == 200
          - fortigate_export.meta.raw is string
          - fortigate_export.meta.raw is match('#config-version=')
          - fortigate_export.meta.raw is search('(?m)^config system global\s*$')
          - fortigate_export.meta.raw is search('(?m)^config system interface\s*$')
          - fortigate_export.meta.raw is search('(?m)^end\s*\Z')
          - "'FortinetPasswordMask' not in fortigate_export.meta.raw"
        fail_msg: Invalid or incomplete export; no backup files were written.
      no_log: true

    - name: Create the private backup parent directory
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Allocate a unique directory for this backup
      ansible.builtin.tempfile:
        state: directory
        path: "{{ backup_root }}"
        prefix: "{{ inventory_hostname }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-"
      register: backup_directory
      delegate_to: localhost

    - name: Save the exact configuration export without displaying its contents
      ansible.builtin.copy:
        content: "{{ fortigate_export.meta.raw }}"
        dest: "{{ backup_directory.path }}/configuration.cfg"
        mode: '0600'
      delegate_to: localhost
      no_log: true
      diff: false

    - name: Calculate the saved file size and SHA-256 checksum
      ansible.builtin.stat:
        path: "{{ backup_directory.path }}/configuration.cfg"
        checksum_algorithm: sha256
      register: backup_file
      delegate_to: localhost

    - name: Verify permissions and that the saved bytes match the response
      ansible.builtin.assert:
        that:
          - backup_file.stat.isreg
          - backup_file.stat.size > 0
          - backup_file.stat.mode == '0600'
          - backup_file.stat.checksum == (fortigate_export.meta.raw | hash('sha256'))
      no_log: true

    - name: Write the completion manifest after the export is verified
      ansible.builtin.copy:
        dest: "{{ backup_directory.path }}/manifest.yml"
        mode: '0600'
        content: |
          status: complete
          collected_at_utc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          inventory_host: {{ inventory_hostname | to_json }}
          source_host: {{ ansible_host | to_json }}
          collection: fortinet.fortios
          collection_version: 2.5.1
          selector: system_config_backup
          scope: global
          configuration_changed_on_device: false
          restore_tested: false
          files:
            configuration.cfg:
              bytes: {{ backup_file.stat.size }}
              sha256: "{{ backup_file.stat.checksum }}"
      delegate_to: localhost
      diff: false

    - name: Report the backup location without configuration contents
      ansible.builtin.debug:
        msg: "Backup complete: {{ backup_directory.path }} (configuration.cfg, manifest.yml). FortiGate configuration was not changed."
