---
- name: 'opnsense_media: bootstrap'
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  connection: local
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    ansible_connection: local
  vars_files:
  - "{{ vault_file | default(((playbook_dir ~ '/..') | realpath) ~ '/secrets/vault.yml') }}"
  roles:
  - role: opnsense_media
    opnsense_media_options:
      task_action: bootstrap
