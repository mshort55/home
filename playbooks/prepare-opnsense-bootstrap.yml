---
- ansible.builtin.import_playbook: prepare-opnsense-iso.yml

- name: Prepare private OPNsense management bootstrap media locally
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    opnsense_bootstrap_dir: "{{ inventory_dir }}/.cache/opnsense-bootstrap/{{ inventory_hostname }}"
    opnsense_iso_cache: "{{ inventory_dir }}/.cache/iso/opnsense-{{ opnsense_release.version }}"
    opnsense_builder_context: "{{ playbook_dir }}/../containers/opnsense-installer"
    opnsense_container_runtime: docker
    vault_file: "{{ playbook_dir }}/../secrets/vault.yml"
  vars_files:
    - ../files/opnsense/release.yml
    - "{{ vault_file }}"
  tasks:
    - name: Require the guest inventory and bounded ZFS management bootstrap
      ansible.builtin.assert:
        that:
          - opnsense_guest in groups.get('opnsense_hosts', [])
          - guest.ansible_user == 'root'
          - guest.opnsense_proxmox_host == inventory_hostname
          - guest.opnsense_bootstrap.filesystem == 'zfs'
          - guest.opnsense_bootstrap.hostname is match('^[a-z][a-z0-9-]{0,62}$')
          - guest.opnsense_bootstrap.domain is match('^[a-z0-9.-]+$')
          - guest.opnsense_bootstrap.timezone is match('^[A-Za-z_]+/[A-Za-z_/]+$')
          - guest.ansible_host is match('^10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$')
          - guest.ansible_host != ansible_host
          - guest.opnsense_bootstrap.prefix == 24
          - guest.opnsense_bootstrap.ssh_public_key_files | length > 0
          - opnsense_vm.networks | map(attribute='role') | list == ['WAN', 'MGMT', 'HOME', 'DEV', 'BMC']
          - not opnsense_vm.wan_connected
          - opnsense_container_runtime in ['docker', 'podman']
          - opnsense_bootstrap_dir.startswith('/')
          - opnsense_bootstrap_dir is not search('[,\r\n]')
          - playbook_dir is not search('[,\r\n]')
          - opnsense_iso_cache is not search('[,\r\n]')
      vars:
        guest: "{{ hostvars[opnsense_guest] }}"

    - name: Require the private guest root credential without displaying it
      ansible.builtin.assert:
        that:
          - vault_devices[opnsense_guest].username == 'root'
          - vault_devices[opnsense_guest].password is string
          - vault_devices[opnsense_guest].password | length >= 12
          - vault_devices[opnsense_guest].password is not search('[\x00\r\n]')
        fail_msg: Add username root and a password of 12–72 UTF-8 bytes under opnsense01 in Vault.
      no_log: true

    - name: Read controller user details
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Require a native ordinary user and a Linux container engine
      ansible.builtin.assert:
        that:
          - ansible_facts.system in ['Linux', 'Darwin']
          - ansible_facts.user_uid | int > 0

    - name: Read the verified original media and builder definition
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ opnsense_iso_cache }}/{{ opnsense_release.filename }}"
        - "{{ opnsense_builder_context }}/Dockerfile"
      register: bootstrap_sources

    - name: Require a verified original ISO
      ansible.builtin.assert:
        that:
          - bootstrap_sources.results[0].stat.isreg | default(false)
          - not bootstrap_sources.results[0].stat.islnk | default(false)

    - name: Read only configured public keys
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ hostvars[opnsense_guest].opnsense_bootstrap.ssh_public_key_files }}"
      register: bootstrap_public_keys
      no_log: true

    - name: Select the definition-owned local builder
      ansible.builtin.set_fact:
        opnsense_builder_image: "home-opnsense-installer:{{ bootstrap_sources.results[1].stat.checksum[:16] }}"

    - name: Inspect the local builder image
      ansible.builtin.command:
        argv: ["{{ opnsense_container_runtime }}", image, inspect, "{{ opnsense_builder_image }}"]
      register: bootstrap_builder
      changed_when: false
      failed_when: bootstrap_builder.rc not in [0, 1, 125]
      check_mode: false
      no_log: true

    - name: Preview the private media preparation
      ansible.builtin.debug:
        msg:
          guest: "{{ opnsense_guest }}"
          management_address: "{{ hostvars[opnsense_guest].ansible_host }}/24"
          filesystem: ZFS stripe with 2 GiB swap on the single 32 GiB VM disk
          artifact_directory: "{{ opnsense_bootstrap_dir }}"
          scope: Local preview only; no media build, password hash, VM boot or disk installation.
      when: ansible_check_mode

    - name: Finish the preparation preview
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Build the native local preparation container if needed
      ansible.builtin.command:
        argv: ["{{ opnsense_container_runtime }}", build, --tag, "{{ opnsense_builder_image }}", "{{ opnsense_builder_context }}"]
      when: bootstrap_builder.rc != 0
      changed_when: true

    - name: Create the private artifact directory
      ansible.builtin.file:
        path: "{{ opnsense_bootstrap_dir }}"
        state: directory
        mode: '0700'

    - name: Write bootstrap settings without the plaintext password
      ansible.builtin.copy:
        dest: "{{ opnsense_bootstrap_dir }}/settings.json"
        mode: '0600'
        content: "{{ {'source_sha256': bootstrap_sources.results[0].stat.checksum, 'hostname': guest.opnsense_bootstrap.hostname, 'domain': guest.opnsense_bootstrap.domain, 'timezone': guest.opnsense_bootstrap.timezone, 'address': guest.ansible_host, 'authorized_keys': (bootstrap_public_keys.results | map(attribute='content') | map('b64decode') | map('trim') | unique | join('\n')) ~ '\n', 'networks': opnsense_vm.networks} | to_nice_json }}\n"
      vars:
        guest: "{{ hostvars[opnsense_guest] }}"
      no_log: true
      diff: false

    - name: Seed and verify the DVD without contacting a server
      ansible.builtin.command:
        argv:
          - "{{ opnsense_container_runtime }}"
          - run
          - --rm
          - --interactive
          - --user
          - "{{ ansible_facts.user_uid }}:{{ ansible_facts.user_gid }}"
          - --network
          - none
          - --read-only
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges
          - --tmpfs
          - /tmp:rw,nosuid,nodev,size=32m
          - --mount
          - "type=bind,src={{ opnsense_iso_cache }},dst=/input,readonly"
          - --mount
          - "type=bind,src={{ opnsense_bootstrap_dir }},dst=/work"
          - --mount
          - "type=bind,src={{ playbook_dir }}/../scripts,dst=/scripts,readonly"
          - "{{ opnsense_builder_image }}"
          - python3
          - /scripts/prepare-opnsense-bootstrap.py
          - --settings
          - /work/settings.json
          - --source
          - "/input/{{ opnsense_release.filename }}"
          - --work
          - /work
          - --installer
          - /scripts/opnsense-install.sh
        stdin: "{{ vault_devices[opnsense_guest].password }}"
        stdin_add_newline: false
        expand_argument_vars: false
      register: bootstrap_build
      changed_when: bootstrap_build.rc == 0 and (bootstrap_build.stdout | from_json).changed
      failed_when: false
      no_log: true

    - name: Preserve failed build diagnostics without the input password
      ansible.builtin.copy:
        dest: "{{ opnsense_bootstrap_dir }}/runner-error.json"
        mode: '0600'
        content: "{{ {'rc': bootstrap_build.rc, 'stdout': bootstrap_build.stdout | default(''), 'stderr': bootstrap_build.stderr | default('')} | to_nice_json }}\n"
      when: bootstrap_build.rc != 0
      no_log: true
      diff: false

    - name: Require successful private media preparation
      ansible.builtin.assert:
        that:
          - bootstrap_build.rc == 0
        fail_msg: "Preparation failed; inspect {{ opnsense_bootstrap_dir }}/runner-error.json locally. No device was contacted."

    - name: Report the management bootstrap artifact
      ansible.builtin.debug:
        msg: "Prepared {{ opnsense_bootstrap_dir }}/opnsense-bootstrap.iso. Use install-opnsense.yml to install the owned VM disk and verify management SSH. Booting this ISO alone does not format a disk."
