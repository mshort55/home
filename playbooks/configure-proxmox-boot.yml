---
- name: Enable the installed firewall at boot and optionally reboot the maintained Proxmox host
  hosts: proxmox_hosts
  gather_facts: false
  become: false
  serial: 1
  vars:
    proxmox_boot_reboot: false
    opnsense_iso_volume: "{{ opnsense_vm.iso_storage }}:iso/{{ opnsense_release.filename }}"
    opnsense_owner_marker: "Managed by create-opnsense-vm.yml; vmid={{ opnsense_vm.vmid }}"
    boot_package_probe: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/inspect-proxmox-packages.py') }}"
    boot_probe: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/inspect-proxmox-boot.py') }}"
    boot_pilot_code: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/configure-opnsense-pilot.php') | b64encode }}"
    boot_pilot_prefix: "printf '%s' {{ boot_pilot_code | quote }} | /usr/bin/base64 -d | /usr/local/bin/php --"
  vars_files:
    - ../files/opnsense/release.yml
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ pve_api.api_host }}"
      api_user: "{{ pve_api.api_user }}"
      api_token_id: "{{ pve_api.api_token_id }}"
      api_token_secret: "{{ pve_api.api_token_secret }}"
      validate_certs: true
      ca_path: "{{ inventory_dir }}/.cache/community-api/{{ inventory_hostname }}/ca.pem"
      api_timeout: 30
  tasks:
    - name: Require the installed connected firewall and explicit maintenance inputs
      ansible.builtin.assert:
        that:
          - ansible_user == 'root'
          - proxmox_boot_reboot is boolean
          - proxmox_host_repository in ['enterprise', 'no-subscription']
          - opnsense_vm.vmid == 100
          - opnsense_vm.onboot is sameas true
          - opnsense_vm.wan_connected is sameas true
          - opnsense_guest in groups.get('opnsense_hosts', [])
          - hostvars[opnsense_guest].opnsense_proxmox_host == inventory_hostname
          - opnsense_vm.name == opnsense_guest
        fail_msg: Set opnsense_vm.onboot to boolean true for the completed connected pilot; use JSON boolean extra variables for reboot selection.

    - name: Load the enrolled Proxmox API
      ansible.builtin.include_tasks: tasks/load-community-api.yml
      vars:
        community_api_host: "{{ inventory_hostname }}"
        community_api_var: pve_api

    - name: Verify the single expected Proxmox node
      community.proxmox.proxmox_node_info:
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: boot_node

    - name: Require the standalone online node identity
      ansible.builtin.assert:
        that:
          - pve_api.node == inventory_hostname
          - boot_node.proxmox_nodes | length == 1
          - boot_node.proxmox_nodes[0].node == inventory_hostname
          - boot_node.proxmox_nodes[0].status == 'online'

    - name: Inspect converged repositories, package health, networking and kernels
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ boot_package_probe }}", "{{ proxmox_host_repository }}", "{{ inventory_hostname }}"]
      changed_when: false
      check_mode: false
      register: boot_packages_read

    - name: Select the pre-maintenance package state
      ansible.builtin.set_fact:
        boot_before: "{{ boot_packages_read.stdout | from_json }}"

    - name: Require converged repositories and the management route through the firewall
      ansible.builtin.assert:
        that:
          - not boot_before.repositories_changed
          - boot_before.default_route.dev == proxmox_network.management.bridge
          - boot_before.default_route.gateway == hostvars[opnsense_guest].ansible_host
          - boot_before.default_route.gateway == proxmox_network.management.gateway

    - name: Inspect boot selection, completed installation and idle guest operations
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ boot_probe }}", "{{ inventory_hostname }}", "{{ opnsense_vm.vmid | string }}", "{{ opnsense_guest }}", "{{ boot_before.latest_installed_kernel }}"]
      changed_when: false
      check_mode: false
      register: boot_identity_read

    - name: Select the pre-maintenance boot identity
      ansible.builtin.set_fact:
        boot_identity_before: "{{ boot_identity_read.stdout | from_json }}"

    - name: Build the inventory-owned VM hardware plan
      ansible.builtin.include_tasks: tasks/build-opnsense-vm.yml

    - name: Read the firewall before enabling automatic startup
      ansible.builtin.include_tasks: tasks/read-proxmox-boot-vm.yml

    - name: Permit only the disabled-to-enabled automatic startup transition
      ansible.builtin.assert:
        that: boot_vm_config.onboot | default(0) in [0, 1]

    - name: Validate every owned hardware setting and the existing WAN connection
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/validate-opnsense-vm.py"]
        stdin: "{{ {'config': boot_vm_config, 'desired': opnsense_expected | combine({'onboot': boot_vm_config.onboot | default(0)})} | to_json }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      check_mode: false
      register: boot_hardware_validation
      failed_when: boot_hardware_validation.rc != 0 or (boot_hardware_validation.stdout | from_json).wan_link_change

    - name: Preserve the validated firewall hardware in memory
      ansible.builtin.set_fact:
        boot_original_config: "{{ boot_vm_config }}"
        boot_pilot_networks: []

    - name: Associate stable VM NICs with the installed firewall sections
      ansible.builtin.set_fact:
        boot_pilot_networks: "{{ boot_pilot_networks + [item | combine({'section': sections[item.role]})] }}"
      loop: "{{ opnsense_vm.networks }}"
      vars:
        sections: {WAN: wan, MGMT: lan, HOME: opt1, DEV: opt2, BMC: opt3}

    - name: Build the read-only management verification payload
      ansible.builtin.set_fact:
        boot_pilot_payload: "{{ hostvars[opnsense_guest].opnsense_pilot | combine({'management_address': hostvars[opnsense_guest].ansible_host, 'networks': boot_pilot_networks}) }}"

    - name: Verify management policy and connectivity before maintenance
      ansible.builtin.include_tasks: tasks/verify-proxmox-boot-network.yml

    - name: Allocate a protected hardware backup before changing automatic startup
      ansible.builtin.tempfile:
        state: directory
        path: /root
        prefix: ansible-firewall-boot-
      register: boot_backup
      when: not ansible_check_mode and not boot_original_config.onboot | default(0) | bool

    - name: Preserve the exact pre-change firewall configuration
      ansible.builtin.copy:
        content: "{{ boot_original_config | to_nice_json }}\n"
        dest: "{{ boot_backup.path }}/vm-config.json"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false
      when: not ansible_check_mode and not boot_original_config.onboot | default(0) | bool

    - name: Report the firewall hardware backup
      ansible.builtin.debug:
        msg: "Pre-change firewall hardware: {{ boot_backup.path }}/vm-config.json"
      when: not ansible_check_mode and not boot_original_config.onboot | default(0) | bool

    - name: Recheck the firewall immediately before its configuration change
      ansible.builtin.include_tasks: tasks/read-proxmox-boot-vm.yml

    - name: Refuse concurrent firewall hardware changes
      ansible.builtin.assert:
        that:
          - boot_vm_config == boot_original_config
          - boot_vm_config.digest is match('^[0-9a-f]{40}$')

    - name: Preview automatic startup without a device write
      ansible.builtin.debug:
        msg: "Enable automatic startup for VM {{ opnsense_vm.vmid }}; retain order=1,up=30,down=120 and all hardware."
      changed_when: true
      when: ansible_check_mode and not boot_original_config.onboot | default(0) | bool

    - name: Enable only automatic startup through the community API
      community.proxmox.proxmox_kvm:
        node: "{{ pve_api.node }}"
        vmid: "{{ opnsense_vm.vmid }}"
        state: present
        update: true
        update_unsafe: false
        digest: "{{ boot_vm_config.digest }}"
        onboot: true
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: not ansible_check_mode and not boot_original_config.onboot | default(0) | bool

    - name: Report whether a controlled reboot would be needed
      ansible.builtin.debug:
        msg:
          automatic_startup: true
          startup: order=1,up=30,down=120
          running_kernel: "{{ boot_before.running_kernel }}"
          default_kernel: "{{ boot_identity_before.default_kernel }}"
          reboot_needed: "{{ boot_before.reboot_needed }}"
          reboot_requested: "{{ proxmox_boot_reboot }}"
      changed_when: ansible_check_mode and proxmox_boot_reboot and boot_before.reboot_needed

    - name: Finish the read-only preview before post-change checks or reboot
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Read back automatic startup before considering reboot
      ansible.builtin.include_tasks: tasks/read-proxmox-boot-vm.yml

    - name: Verify only automatic startup changed
      ansible.builtin.assert:
        that:
          - boot_vm_config.onboot == 1
          - (boot_vm_config | dict2items | rejectattr('key', 'in', ['digest', 'onboot']) | items2dict) == (boot_original_config | dict2items | rejectattr('key', 'in', ['digest', 'onboot']) | items2dict)

    - name: Recheck host boot readiness immediately before a requested reboot
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ boot_probe }}", "{{ inventory_hostname }}", "{{ opnsense_vm.vmid | string }}", "{{ opnsense_guest }}", "{{ boot_before.latest_installed_kernel }}"]
      changed_when: false

    - name: Reboot only when requested and required by kernel or package state
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        post_reboot_delay: 30
        test_command: /usr/bin/systemctl is-active pve-guests pveproxy pvedaemon pvestatd
        msg: Ansible maintenance reboot after verifying firewall automatic startup
      when: proxmox_boot_reboot and boot_before.reboot_needed
      register: boot_reboot

    - name: Recheck package health, kernels and protected host configuration
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ boot_package_probe }}", "{{ proxmox_host_repository }}", "{{ inventory_hostname }}"]
      changed_when: false
      register: boot_after_read

    - name: Select the post-maintenance package state
      ansible.builtin.set_fact:
        boot_after: "{{ boot_after_read.stdout | from_json }}"

    - name: Verify preserved host networking, storage and repositories
      ansible.builtin.assert:
        that:
          - not boot_after.repositories_changed
          - boot_after.protected_sha256 == boot_before.protected_sha256
          - boot_after.debian_sha256 == boot_before.debian_sha256
          - boot_after.default_route == boot_before.default_route
          - boot_after.latest_installed_kernel == boot_before.latest_installed_kernel
          - not boot_reboot.changed | default(false) or boot_after.running_kernel == boot_before.latest_installed_kernel
          - not boot_reboot.changed | default(false) or not boot_after.reboot_needed

    - name: Verify the host boot identity and running guest after maintenance
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "{{ boot_probe }}", "{{ inventory_hostname }}", "{{ opnsense_vm.vmid | string }}", "{{ opnsense_guest }}", "{{ boot_after.latest_installed_kernel }}"]
      changed_when: false
      register: boot_identity_after_read

    - name: Verify whether the host boot identity changed
      ansible.builtin.assert:
        that: ((boot_identity_after_read.stdout | from_json).boot_id != boot_identity_before.boot_id) == (boot_reboot.changed | default(false))

    - name: Verify the recovered firewall hardware and power through the community API
      ansible.builtin.include_tasks: tasks/read-proxmox-boot-vm.yml

    - name: Require identical firewall hardware after maintenance
      ansible.builtin.assert:
        that:
          - boot_vm_config.onboot == 1
          - (boot_vm_config | dict2items | rejectattr('key', 'in', ['digest', 'onboot']) | items2dict) == (boot_original_config | dict2items | rejectattr('key', 'in', ['digest', 'onboot']) | items2dict)

    - name: Verify recovered management policy and outbound connectivity
      ansible.builtin.include_tasks: tasks/verify-proxmox-boot-network.yml

    - name: Report verified startup and maintenance results
      ansible.builtin.debug:
        msg:
          firewall: "{{ opnsense_guest }} running; automatic startup enabled"
          rebooted: "{{ boot_reboot.changed | default(false) }}"
          running_kernel: "{{ boot_after.running_kernel }}"
          reboot_needed: "{{ boot_after.reboot_needed }}"
          wan_address: "{{ (boot_guest_network.stdout | trim | from_json).wan_address }}"
          ntp_synchronized: "{{ (boot_guest_network.stdout | trim | from_json).ntp_synchronized }}"
