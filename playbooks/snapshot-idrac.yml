---
- name: Save an iDRAC state snapshot
  hosts: idracs
  connection: local
  gather_facts: false
  become: false
  serial: 1
  vars:
    backup_root: "{{ playbook_dir }}/../backups"
    vault_file: "{{ playbook_dir }}/../secrets/vault.yml"
    idrac_resources:
      - name: manager
        path: /redfish/v1/Managers/iDRAC.Embedded.1
      - name: system
        path: /redfish/v1/Systems/System.Embedded.1
      - name: bios
        path: /redfish/v1/Systems/System.Embedded.1/Bios
      - name: chassis
        path: /redfish/v1/Chassis/System.Embedded.1
      - name: power
        path: /redfish/v1/Chassis/System.Embedded.1/Power
      - name: thermal
        path: /redfish/v1/Chassis/System.Embedded.1/Thermal
      - name: virtual_media
        path: /redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/CD
      - name: jobs
        path: /redfish/v1/Managers/iDRAC.Embedded.1/Jobs
      - name: tasks
        path: /redfish/v1/TaskService/Tasks
      - name: lifecycle_log_entries
        path: /redfish/v1/Managers/iDRAC.Embedded.1/Logs/Lclog
  vars_files:
    - "{{ vault_file }}"

  tasks:
    - name: Require a real snapshot run
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use --syntax-check for offline validation; snapshot collection requires a normal run.

    - name: Read current state using verified HTTPS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ item.path }}"
        method: GET
        url_username: "{{ vault_devices[inventory_hostname].username }}"
        url_password: "{{ vault_devices[inventory_hostname].password }}"
        force_basic_auth: true
        validate_certs: true
        ca_path: "{{ idrac_ca_path }}"
        ciphers: "{{ idrac_tls_ciphers | default(omit) }}"
        follow_redirects: none
        use_proxy: false
        return_content: true
        status_code: "{{ [200] if item.name in ['manager', 'system'] else [200, 404, 501] }}"
        timeout: 30
      loop: "{{ idrac_resources }}"
      register: idrac_reads
      until: >-
        idrac_reads.status | default(0) != -1 or
        'timed out' not in (idrac_reads.msg | default('') | lower)
      retries: 2
      delay: 5
      no_log: true
      diff: false

    - name: Require manager and system identification responses
      ansible.builtin.assert:
        that:
          - idrac_reads.results[0].status == 200
          - idrac_reads.results[0].json.FirmwareVersion is defined
          - idrac_reads.results[1].status == 200
          - idrac_reads.results[1].json.Model is defined
        fail_msg: Expected iDRAC identification resources were unavailable; no state snapshot was written.
      no_log: true

    - name: Collect resource bodies without credentials or request arguments
      ansible.builtin.set_fact:
        idrac_observations: >-
          {{ idrac_observations | default({}) | combine({item.item.name:
             {'path': item.item.path, 'http_status': item.status,
              'body': item.json | default({})}}) }}
      loop: "{{ idrac_reads.results }}"
      no_log: true

    - name: Start discovery at advertised storage and simple storage collections
      ansible.builtin.set_fact:
        idrac_storage_roots: >-
          {%- set roots = namespace(paths={}) -%}
          {%- for key in ['Storage', 'SimpleStorage'] -%}
          {%- set link = idrac_observations.system.body.get(key, {}) -%}
          {%- if link is mapping and '@odata.id' in link -%}
          {%- set roots.paths = roots.paths | combine({key: link['@odata.id']}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ roots.paths }}
        idrac_storage_resources: {}
      no_log: true

    - name: Queue unique advertised storage roots
      ansible.builtin.set_fact:
        idrac_storage_pending: "{{ idrac_storage_roots.values() | unique | list }}"
      no_log: true

    - name: Discover up to 64 storage resources
      ansible.builtin.include_tasks: tasks/snapshot-idrac-storage.yml
      when: idrac_storage_pending | length > 0

    - name: Record storage discovery and its limits
      ansible.builtin.set_fact:
        idrac_observations: >-
          {{ idrac_observations | combine({'storage_discovery': {
            'root_advertised': idrac_observations.system.body.Storage is defined,
            'advertised_roots': idrac_storage_roots,
            'resources': idrac_storage_resources,
            'unread_paths': idrac_storage_pending,
            'resource_limit': 64,
            'pagination_followed': false}}) }}
      no_log: true

    - name: Select advertised network and PCIe inventory roots
      ansible.builtin.set_fact:
        idrac_network_roots: >-
          {%- set roots = namespace(paths={}) -%}
          {%- for owner in ['system', 'manager', 'chassis'] -%}
          {%- set body = idrac_observations[owner].body -%}
          {%- for key in ['EthernetInterfaces', 'NetworkInterfaces', 'NetworkAdapters'] -%}
          {%- set link = body.get(key, {}) -%}
          {%- if link is mapping and '@odata.id' in link -%}
          {%- set roots.paths = roots.paths | combine({owner ~ '.' ~ key: link['@odata.id']}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- if 'system.NetworkAdapters' not in roots.paths -%}
          {%- set roots.paths = roots.paths | combine({'documented_optional.NetworkAdapters':
            '/redfish/v1/Systems/System.Embedded.1/NetworkAdapters'}) -%}
          {%- endif -%}
          {{ roots.paths }}
        idrac_network_resources: {}
      no_log: true

    - name: Queue network roots and advertised PCIe devices and functions
      ansible.builtin.set_fact:
        idrac_network_pending: >-
          {%- set links = namespace(paths=idrac_network_roots.values() | list) -%}
          {%- for link in (idrac_observations.system.body.PCIeDevices | default([])) +
                         (idrac_observations.system.body.PCIeFunctions | default([])) -%}
          {%- if link is mapping and '@odata.id' in link -%}
          {%- set links.paths = links.paths + [link['@odata.id']] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ links.paths | unique | list }}
      no_log: true

    - name: Discover up to 128 network and PCIe resources
      ansible.builtin.include_tasks: tasks/snapshot-idrac-network.yml
      when: idrac_network_pending | length > 0

    - name: Record network discovery and its limits
      ansible.builtin.set_fact:
        idrac_observations: >-
          {{ idrac_observations | combine({'network_discovery': {
            'roots': idrac_network_roots,
            'resources': idrac_network_resources,
            'unread_paths': idrac_network_pending,
            'resource_limit': 128,
            'pagination_followed': false,
            'linux_interface_names_observed': false}}) }}
      no_log: true

    - name: Create the private backup parent directory
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'

    - name: Allocate a unique state snapshot directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ backup_root }}"
        prefix: "{{ inventory_hostname }}-snapshot-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-"
      register: snapshot_directory

    - name: Save private observations
      ansible.builtin.copy:
        content: "{{ idrac_observations | to_nice_json }}\n"
        dest: "{{ snapshot_directory.path }}/observations.json"
        mode: '0600'
      no_log: true
      diff: false

    - name: Calculate the snapshot checksum and size
      ansible.builtin.stat:
        path: "{{ snapshot_directory.path }}/observations.json"
        checksum_algorithm: sha256
      register: snapshot_file

    - name: Verify snapshot permissions and integrity
      ansible.builtin.assert:
        that:
          - snapshot_file.stat.isreg
          - snapshot_file.stat.mode == '0600'
          - snapshot_file.stat.checksum == ((idrac_observations | to_nice_json ~ '\n') | hash('sha256'))
      no_log: true

    - name: Write the snapshot completion record
      ansible.builtin.copy:
        dest: "{{ snapshot_directory.path }}/manifest.yml"
        mode: '0600'
        content: |
          status: complete
          artifact_type: state_snapshot
          collected_at_utc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          inventory_host: {{ inventory_hostname | to_json }}
          source_host: {{ ansible_host | to_json }}
          configuration_changed_on_device: false
          recovery_backup: false
          files:
            observations.json:
              bytes: {{ snapshot_file.stat.size }}
              sha256: "{{ snapshot_file.stat.checksum }}"
      diff: false

    - name: Report the snapshot location and firmware versions
      ansible.builtin.debug:
        msg:
          - "Snapshot saved: {{ snapshot_directory.path }}"
          - "iDRAC: {{ idrac_observations.manager.body.FirmwareVersion }}; BIOS: {{ idrac_observations.system.body.BiosVersion | default('unavailable') }}"
          - "This is a state snapshot. Recovery backups, job readiness and RAID initialization require separate verification."
