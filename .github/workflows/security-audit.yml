---
name: Security audit
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Dependency and history audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up the repository
        run: python3 tools/setup.py
      - name: Audit dependency and SSH build locks and complete Git history
        run: ./just audit
