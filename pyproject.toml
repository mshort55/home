[tool.ruff]
target-version = "py312"
line-length = 120
include = ["scripts/**/*.py", "plugins/**/*.py", "tools/**/*.py", "tests/**/*.py"]
# This builder hashes its own bytes into existing installation identities.
# Preserve its current formatting until an explicit media recipe migration.
extend-exclude = ["scripts/prepare-opnsense-bootstrap.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

[tool.coverage.run]
branch = true
include = [
  "plugins/action/fortigate_dhcp_plan.py",
  "plugins/action/wireguard_keys.py",
  "scripts/validate-opnsense-vm.py",
  "scripts/unifi-isolation.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
