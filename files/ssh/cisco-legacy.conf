# This file is selected only by the Cisco inventory group's libssh transport.
# Prefer modern defaults; add only the signature, group14 KEX and full SHA-1 MAC
# required by legacy IOS. Never enable group1, CBC, 3DES or truncated SHA-1 MACs.
Host *
    HostKeyAlgorithms +ssh-rsa
    KexAlgorithms +diffie-hellman-group14-sha1
    Ciphers aes256-ctr,aes192-ctr,aes128-ctr
    MACs +hmac-sha1
