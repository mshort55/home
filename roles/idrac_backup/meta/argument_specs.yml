---
argument_specs:
  main:
    short_description: Validate and dispatch idrac_backup actions.
    options:
      idrac_backup_options:
        type: dict
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        required: true
        options:
          task_action:
            type: str
            description: Select the matching action task file.
            required: true
            choices:
            - export
      idrac_ca_path:
        type: path
        description: Verified iDRAC CA file.
      idrac_tls_ciphers:
        type: list
        description: Optional legacy TLS cipher allowlist; omitted uses controller defaults.
        elements: str
      backup_root:
        type: path
        description: Private controller backup parent.
        default: "{{ (role_path ~ '/../..') | realpath }}/backups"
      vault_file:
        type: path
        description: Encrypted controller credential source.
        default: "{{ (role_path ~ '/../..') | realpath }}/secrets/vault.yml"
  export:
    short_description: 'idrac_backup: export.'
    options:
      idrac_backup_options:
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        options:
          task_action:
            choices:
            - export
            description: Select the matching action task file.
            required: true
            type: str
        required: true
        type: dict
      idrac_ca_path:
        type: path
        description: Verified iDRAC CA file.
        required: true
