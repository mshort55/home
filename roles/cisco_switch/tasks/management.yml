---
- name: Run cisco_switch backup
  when: not ansible_check_mode
  ansible.builtin.include_tasks: _backup.yml
- name: Prepare inventory-owned VLANs and the management SVI
  block:
  - name: Require management and VLAN inputs
    ansible.builtin.assert:
      that:
      - switch_vlans is defined
      - switch_vlans | length > 0
      - switch_management is defined
      - switch_management.vlan is integer
      - switch_management.vlan in (switch_vlans | map(attribute='vlan_id') | list)
      - switch_management.address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/24$')
      - switch_management.address.split('/')[0].split('.') | map('int') | max <= 255
      - switch_management.address.split('/')[0].split('.')[-1] | int > 0
      - switch_management.address.split('/')[0].split('.')[-1] | int < 255
      - switch_management.description is match('^[A-Za-z0-9 _.-]{1,80}$')
      - switch_management.legacy_interface is match('^Vlan[0-9]+$')
      - management_interface != switch_management.legacy_interface
      - switch_management.legacy_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/24$')
      - switch_management.legacy_address.split('/')[0].split('.') | map('int') | max <= 255
      - switch_management.address.split('/')[0].split('.')[:3] != switch_management.legacy_address.split('/')[0].split('.')[:3]
      - switch_vlans | map(attribute='vlan_id') | unique | length == switch_vlans | length
  - name: Validate VLAN definitions
    ansible.builtin.assert:
      that:
      - item.vlan_id is integer
      - item.vlan_id >= 2 and item.vlan_id <= 1001
      - item.name is match('^[A-Za-z0-9_.-]{1,32}$')
      - item.state == 'active'
    loop: "{{ switch_vlans }}"
  - name: Read current configuration and operational routing dependencies
    cisco.ios.ios_command:
      commands:
      - show running-config
      - show startup-config
      - show ip interface brief
      - show ip route
      - show ip arp
      retries: 1
    register: management_before
    changed_when: false
    no_log: true
  - name: Require complete responses and synchronized running and startup configuration
    ansible.builtin.assert:
      that:
      - management_before.stdout | length == 5
      - management_before.stdout[0] is search('(?m)^version \\S+')
      - management_before.stdout[1] is search('(?m)^version \\S+')
      - management_before.stdout[0] is search('(?m)^end\\s*$')
      - management_before.stdout[1] is search('(?m)^end\\s*$')
      - running_body == startup_body
      fail_msg: Incomplete responses or unrelated unsaved configuration; stop and review privately.
    vars:
      running_body: "{{ management_before.stdout[0] | regex_search('(?ms)^version .*') | regex_replace('(?ms)^crypto pki certificate\
        \ chain .*?(?=^!)', '') }}"
      startup_body: "{{ management_before.stdout[1] | regex_search('(?ms)^version .*') | regex_replace('(?ms)^crypto pki certificate\
        \ chain .*?(?=^!)', '') }}"
    no_log: true
  - name: Refuse IPv6 routing and configured routing dependencies
    ansible.builtin.assert:
      that:
      - management_before.stdout[0] is not search('(?m)^(ipv6 unicast-routing|router |ip route |ip route$)')
      - management_before.stdout[0] is not search('(?m)^ ip (policy|helper-address) ')
      fail_msg: Routing, policy routing or relay configuration needs separate review before this stage.
    no_log: true
  - name: Require only the legacy network to be operational before disabling routing
    ansible.builtin.assert:
      that:
      - management_before.stdout[2] is search('(?m)^Interface\\s+IP-Address')
      - management_before.stdout[3] is search('Gateway of last resort is not set')
      - management_before.stdout[3] is not search('\\bvia\\b')
      - management_before.stdout[3] | regex_findall('directly connected, ([A-Za-z0-9/.-]+)') | unique | list == [switch_management.legacy_interface]
      - management_before.stdout[2] | regex_findall('(?m)^(Vlan[0-9]+)\\s+.*\\s+up\\s+up\\s*$') | difference([switch_management.legacy_interface])
        | length == 0
      - management_before.stdout[4] is search('(?m)^Protocol\\s+Address')
      - management_before.stdout[4] | regex_findall('(?m)^Internet\\s+\\S+\\s+[0-9]+\\s+\\S+\\s+ARPA\\s+(Vlan[0-9]+)\\s*$')
        | difference([switch_management.legacy_interface]) | length == 0
      fail_msg: An active non-legacy network, peer or route needs separate review before disabling routing.
    when: management_before.stdout[0] is search('(?m)^ip routing\\s*$')
    no_log: true
  - name: Read current VLAN and SVI resources
    cisco.ios.ios_facts:
      gather_subset:
      - min
      gather_network_resources:
      - vlans
      - interfaces
      - l3_interfaces
    no_log: true
  - name: Preserve the known legacy management address and refuse conflicting new SVI addresses
    ansible.builtin.assert:
      that:
      - legacy_l3 | length == 1
      - legacy_l3[0].ipv4 | map(attribute='address') | list == [switch_management.legacy_address]
      - target_l3 | length == 0 or target_addresses | length == 0 or target_addresses == [switch_management.address]
      - other_target_addresses | length == 0
      fail_msg: Existing SVI addresses conflict with this bounded management stage.
    vars:
      legacy_l3: "{{ ansible_facts['network_resources'].l3_interfaces | selectattr('name', 'equalto', switch_management.legacy_interface)\
        \ | list }}"
      target_l3: "{{ ansible_facts['network_resources'].l3_interfaces | selectattr('name', 'equalto', management_interface)\
        \ | list }}"
      target_addresses: "{{ target_l3 | map(attribute='ipv4', default=[]) | flatten | map(attribute='address', default='')\
        \ | list }}"
      other_target_addresses: "{{ ansible_facts['network_resources'].l3_interfaces | rejectattr('name', 'equalto', management_interface)\
        \ | map(attribute='ipv4', default=[]) | flatten | selectattr('address', 'defined') | map(attribute='address') | map('regex_replace',\
        \ '/.*$', '') | select('equalto', switch_management.address.split('/')[0]) | list }}"
    no_log: true
  - name: Refuse VLAN name conflicts and special VLAN features
    ansible.builtin.assert:
      that:
      - existing_vlan | length == 0 or existing_vlan[0].name == item.name
      - existing_vlan | length == 0 or existing_vlan[0].private_vlan is not defined
      - existing_vlan | length == 0 or not existing_vlan[0].remote_span | default(false)
      - existing_vlan | length == 0 or existing_vlan[0].shutdown | default('disabled') == 'disabled'
      fail_msg: Existing VLAN configuration needs separate review.
    vars:
      existing_vlan: "{{ ansible_facts['network_resources'].vlans | selectattr('vlan_id', 'equalto', item.vlan_id) | list\
        \ }}"
    loop: "{{ switch_vlans }}"
  - name: Merge the inventory-owned VLAN objects
    cisco.ios.ios_vlans:
      config: "{{ switch_vlans }}"
      state: merged
    register: management_vlan_result
  - name: Disable switch IPv4 routing before activating the management SVI
    cisco.ios.ios_config:
      lines:
      - no ip routing
    register: management_routing_result
    when: management_before.stdout[0] is search('(?m)^ip routing\\s*$')
  - name: Verify routing is disabled before adding the SVI
    when: not ansible_check_mode
    block:
    - name: Read the post-routing configuration
      cisco.ios.ios_command:
        commands:
        - show running-config
        retries: 1
      register: management_routing_readback
      no_log: true
    - name: Require complete configuration without IPv4 or IPv6 routing
      ansible.builtin.assert:
        that:
        - management_routing_readback.stdout[0] is search('(?m)^end\\s*$')
        - management_routing_readback.stdout[0] is not search('(?m)^(ip routing|ipv6 unicast-routing)\\s*$')
      no_log: true
  - name: Merge the management SVI address
    cisco.ios.ios_l3_interfaces:
      config: "{{ management_l3 }}"
      state: merged
    register: management_l3_result
  - name: Enable and describe the management SVI
    cisco.ios.ios_interfaces:
      config:
      - name: "{{ management_interface }}"
        description: "{{ switch_management.description }}"
        enabled: true
      state: merged
    register: management_interface_result
  - name: Verify and persist the management configuration
    when: not ansible_check_mode
    block:
    - name: Read back VLANs and SVI configuration
      cisco.ios.ios_facts:
        gather_subset:
        - min
        gather_network_resources:
        - vlans
        - interfaces
        - l3_interfaces
      no_log: true
    - name: Verify each configured VLAN
      ansible.builtin.assert:
        that:
        - actual_vlan.name == item.name
        - actual_vlan.state | default('active') == 'active'
      vars:
        actual_vlan: "{{ ansible_facts['network_resources'].vlans | selectattr('vlan_id', 'equalto', item.vlan_id) | first\
          \ }}"
      loop: "{{ switch_vlans }}"
    - name: Verify management address and preserved legacy address
      ansible.builtin.assert:
        that:
        - actual_l3.ipv4 | map(attribute='address') | list == [switch_management.address]
        - actual_interface.enabled | default(true)
        - actual_interface.description == switch_management.description
        - legacy_l3.ipv4 | map(attribute='address') | list == [switch_management.legacy_address]
      vars:
        actual_l3: "{{ ansible_facts['network_resources'].l3_interfaces | selectattr('name', 'equalto', management_interface)\
          \ | first }}"
        actual_interface: "{{ ansible_facts['network_resources'].interfaces | selectattr('name', 'equalto', management_interface)\
          \ | first }}"
        legacy_l3: "{{ ansible_facts['network_resources'].l3_interfaces | selectattr('name', 'equalto', switch_management.legacy_interface)\
          \ | first }}"
      no_log: true
    - name: Save verified management changes to startup
      cisco.ios.ios_config:
        save_when: always
      when: management_vlan_result.changed or management_routing_result.changed or management_l3_result.changed or management_interface_result.changed
      no_log: true
  - name: Report bounded configuration commands in check mode
    ansible.builtin.debug:
      msg: "{{ (management_vlan_result.commands | default([])) + (management_routing_result.commands | default([])) + (management_l3_result.commands\
        \ | default([])) + (management_interface_result.commands | default([])) }}"
    when: ansible_check_mode
  - name: Report management stage
    ansible.builtin.debug:
      msg: "{{ 'Previewed' if ansible_check_mode else 'Verified and saved' }} VLANs and management SVI. Configure selected\
        \ ports with the shared port playbook, then test their endpoint connectivity. The legacy management address is retained."
  vars:
    management_interface: Vlan{{ switch_management.vlan }}
    management_l3:
    - name: "{{ management_interface }}"
      ipv4:
      - address: "{{ switch_management.address }}"
