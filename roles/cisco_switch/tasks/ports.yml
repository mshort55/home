---
- name: Require an explicit nonempty valid port scope
  ansible.builtin.assert:
    that:
    - switch_port_roles is defined
    - switch_port_roles is sequence and switch_port_roles is not string and switch_port_roles is not mapping
    - switch_port_roles | length > 0
    - switch_port_roles | select('string') | list | length == switch_port_roles | length
    - switch_port_roles | unique | length == switch_port_roles | length
    - switch_ports is defined
    - switch_port_roles | difference(switch_ports | map(attribute='role') | list) | length == 0
    fail_msg: Use a named switch-port entry point or explicitly supply a nonempty list of inventory roles in switch_port_roles.
  tags:
  - always
- name: Run cisco_switch backup
  when: not ansible_check_mode
  ansible.builtin.include_tasks: _backup.yml
- name: Configure inventory-owned switch ports
  block:
  - name: Require defined port configuration and valid scope
    ansible.builtin.assert:
      that:
      - switch_ports is defined
      - switch_ports | length > 0
      - switch_ports | map(attribute='role') | unique | length == switch_ports | length
      - switch_ports | map(attribute='name') | unique | length == switch_ports | length
      - switch_port_roles | difference(switch_ports | map(attribute='role') | list) | length == 0
  - name: Select managed ports
    ansible.builtin.set_fact:
      selected_ports: "{{ switch_ports | selectattr('role', 'in', switch_port_roles) | list }}"
  - name: Validate port identity and mode inputs
    ansible.builtin.assert:
      that:
      - selected_ports | length > 0
      - item.name is match('^GigabitEthernet[0-9]+/[0-9]+/[0-9]+$')
      - item.description is match('^[A-Za-z0-9 _.-]{1,80}$')
      - item.enabled is boolean
      - item.mode | default('access') in ['access', 'trunk']
      - item.allow_mode_change | default(false) is boolean
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
  - name: Validate access-port VLAN inputs
    ansible.builtin.assert:
      that:
      - item.access_vlan is integer
      - item.access_vlan >= 1 and item.access_vlan <= 4094
      - item.native_vlan is not defined
      - item.allowed_vlans is not defined
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
    when: item.mode | default('access') == 'access'
  - name: Validate static trunk VLAN inputs
    ansible.builtin.assert:
      that:
      - item.access_vlan is not defined
      - item.native_vlan is integer
      - item.native_vlan >= 1 and item.native_vlan <= 4094
      - item.allowed_vlans is sequence and item.allowed_vlans is not string and item.allowed_vlans is not mapping
      - item.allowed_vlans | length > 0
      - item.allowed_vlans | select('integer') | list | length == item.allowed_vlans | length
      - item.allowed_vlans | unique | length == item.allowed_vlans | length
      - item.allowed_vlans | min >= 1 and item.allowed_vlans | max <= 4094
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
    when: item.mode | default('access') == 'trunk'
  - name: Refuse to persist unrelated unsaved configuration
    ansible.builtin.assert:
      that: running_body == startup_body
      fail_msg: Running and startup differ beyond certificate storage; review those changes before applying and saving ports.
    vars:
      running_body: "{{ switch_export.stdout[1] | regex_search('(?ms)^version .*') | regex_replace('(?ms)^crypto pki certificate\
        \ chain .*?(?=^!)', '') }}"
      startup_body: "{{ switch_export.stdout[2] | regex_search('(?ms)^version .*') | regex_replace('(?ms)^crypto pki certificate\
        \ chain .*?(?=^!)', '') }}"
    when: not ansible_check_mode
    no_log: true
  - name: Read existing interface and layer two configuration
    cisco.ios.ios_facts:
      gather_subset:
      - min
      gather_network_resources:
      - interfaces
      - l2_interfaces
      - vlans
    no_log: true
  - name: Initialize available VLAN IDs
    ansible.builtin.set_fact:
      active_vlan_ids: []
  - name: Select active VLANs from resource facts
    ansible.builtin.set_fact:
      active_vlan_ids: "{{ active_vlan_ids + [item.vlan_id] }}"
    loop: "{{ ansible_facts['network_resources'].vlans }}"
    when:
    - item.state | default('active') == 'active'
    - item.shutdown | default('disabled') != 'enabled'
    no_log: true
  - name: Require ordinary layer two ports and existing active VLANs
    ansible.builtin.assert:
      that:
      - item.name in (ansible_facts['network_resources'].interfaces | map(attribute='name') | list)
      - desired_vlans | difference(active_vlan_ids) | length == 0
      - existing_l2 | length == 1
      - existing_l2[0].mode | default('') in ['access', 'trunk']
      - existing_l2[0].mode == item.mode | default('access') or item.allow_mode_change | default(false)
      - existing_l2[0].voice is not defined
      - existing_l2[0].get('access', {}).vlan_name is not defined
      - existing_l2[0].private_vlan is not defined
      - existing_l2[0].xconnect is not defined
      - existing_l2[0].encapsulation is not defined
      fail_msg: Review unexpected port features, missing or inactive VLANs, or a mode conversion without inventory permission.
    vars:
      existing_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | list\
        \ }}"
      desired_vlans: "{{ [item.access_vlan] if item.mode | default('access') == 'access' else item.allowed_vlans + [item.native_vlan]\
        \ }}"
    loop: "{{ selected_ports }}"
    no_log: true
  - name: Read selected interface configuration before changes
    cisco.ios.ios_command:
      commands:
      - show running-config interface {{ item.name }}
      retries: 1
    loop: "{{ selected_ports }}"
    register: port_config_before
    no_log: true
  - name: Refuse routed ports, aggregation members and unexpected interface services
    ansible.builtin.assert:
      that:
      - item.stdout | length == 1
      - item.stdout[0] is search('(?m)^interface ' ~ (item.item.name | regex_escape) ~ '\\s*$')
      - item.stdout[0] is search('(?m)^end\\s*$')
      - item.stdout[0] is not search('(?m)^ (no switchport|channel-group|service instance|ip address|ipv6 address|ip access-group|ipv6
        traffic-filter|mac access-group)( |$)')
      fail_msg: A selected interface has unexpected dependencies or an incomplete configuration response; review it before
        changing the port.
    loop: "{{ port_config_before.results }}"
    no_log: true
  - name: Initialize resource-module inputs
    ansible.builtin.set_fact:
      port_interfaces: []
      port_access: []
      port_trunks: []
  - name: Build resource-module inputs
    ansible.builtin.set_fact:
      port_interfaces: "{{ (port_interfaces | default([])) + [{'name': item.name, 'description': item.description, 'enabled':\
        \ item.enabled}] }}"
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
  - name: Build access-port inputs
    ansible.builtin.set_fact:
      port_access: |-
        {{ port_access + [
          {'name': item.name, 'mode': 'access'} |
          combine({'access': {'vlan': item.access_vlan}} if needs_vlan_assignment else {})
        ] }}
    vars:
      existing_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | first\
        \ }}"
      needs_vlan_assignment: "{{ item.access_vlan != 1 or existing_l2.get('access', {}).get('vlan', 1) != 1 }}"
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
    when: item.mode | default('access') == 'access'
  - name: Build exact trunk inputs while retaining other layer two settings
    ansible.builtin.set_fact:
      port_trunks: "{{ port_trunks + [existing_l2 | combine({'mode': 'trunk', 'nonegotiate': true, 'trunk': existing_l2.get('trunk',\
        \ {}) | combine({'encapsulation': 'dot1q', 'native_vlan': item.native_vlan, 'allowed_vlans': item.allowed_vlans |\
        \ map('string') | list})})] }}"
    vars:
      existing_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | first\
        \ }}"
    loop: "{{ selected_ports }}"
    loop_control:
      label: "{{ item.role }}"
    when: item.mode | default('access') == 'trunk'
  - name: Apply access VLAN and mode to selected ports
    cisco.ios.ios_l2_interfaces:
      config: "{{ port_access }}"
      state: merged
    register: port_l2_result
    when: port_access | length > 0
  - name: Apply exact static trunk VLANs and disable negotiation
    cisco.ios.ios_l2_interfaces:
      config: "{{ port_trunks }}"
      state: replaced
    register: port_trunk_result
    when: port_trunks | length > 0
  - name: Apply descriptions and administrative state to selected ports
    cisco.ios.ios_interfaces:
      config: "{{ port_interfaces }}"
      state: merged
    register: port_interface_result
  - name: Verify and persist the applied configuration
    when: not ansible_check_mode
    block:
    - name: Read back interface configuration
      cisco.ios.ios_facts:
        gather_subset:
        - min
        gather_network_resources:
        - interfaces
        - l2_interfaces
        - vlans
      no_log: true
    - name: Verify each managed port
      ansible.builtin.assert:
        that:
        - actual_interface.description == item.description
        - actual_interface.enabled | default(true) == item.enabled
        - actual_l2.mode == item.mode | default('access')
      vars:
        actual_interface: "{{ ansible_facts['network_resources'].interfaces | selectattr('name', 'equalto', item.name) | first\
          \ }}"
        actual_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | first\
          \ }}"
      loop: "{{ selected_ports }}"
      loop_control:
        label: "{{ item.role }}"
    - name: Verify each access VLAN
      ansible.builtin.assert:
        that:
        - actual_l2.get('access', {}).vlan_name is not defined
        - actual_l2.access.vlan | default(1) == item.access_vlan
      vars:
        actual_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | first\
          \ }}"
      loop: "{{ selected_ports }}"
      loop_control:
        label: "{{ item.role }}"
      when: item.mode | default('access') == 'access'
    - name: Verify exact trunk VLANs, encapsulation and disabled negotiation
      ansible.builtin.assert:
        that:
        - actual_l2.trunk.encapsulation == 'dot1q'
        - actual_l2.trunk.native_vlan == item.native_vlan
        - actual_l2.nonegotiate | default(false)
        - actual_l2.trunk.allowed_vlans is defined
        - actual_l2.trunk.allowed_vlans | join(',') | ansible.netcommon.vlan_expander | sort == item.allowed_vlans | sort
      vars:
        actual_l2: "{{ ansible_facts['network_resources'].l2_interfaces | selectattr('name', 'equalto', item.name) | first\
          \ }}"
      loop: "{{ selected_ports }}"
      loop_control:
        label: "{{ item.role }}"
      when: item.mode | default('access') == 'trunk'
    - name: Save verified port changes to startup
      cisco.ios.ios_config:
        save_when: always
      when: port_l2_result.changed or port_trunk_result.changed or port_interface_result.changed
      no_log: true
  - name: Report bounded commands in check mode
    ansible.builtin.debug:
      msg: "{{ (port_l2_result.commands | default([])) + (port_trunk_result.commands | default([])) + (port_interface_result.commands\
        \ | default([])) }}"
    when: ansible_check_mode
  - name: Report configured scope
    ansible.builtin.debug:
      msg: "{{ 'Previewed' if ansible_check_mode else 'Verified and saved' }} port roles: {{ selected_ports | map(attribute='role')\
        \ | join(', ') }}. Physical cable moves and endpoint reachability are checked separately."
