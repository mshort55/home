---
- name: Validate the selected cisco_switch action contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs[cisco_switch_options.task_action].options\
      \ }}"
    validate_args_context:
      name: cisco_switch
      type: role
      argument_spec_name: "{{ cisco_switch_options.task_action }}"
  tags:
  - always
- name: Dispatch the explicit cisco_switch action
  ansible.builtin.include_tasks:
    file: "{{ cisco_switch_options.task_action }}.yml"
  tags:
  - always
