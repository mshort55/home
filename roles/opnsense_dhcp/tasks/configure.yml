---
- name: Preview the native vendor model and read-only activation prerequisites
  ansible.builtin.raw: "{{ dhcp_prefix }} plan {{ dhcp_payload | to_json | b64encode | quote }}"
  register: dhcp_preview
  changed_when: dhcp_preview.rc == 0 and ansible_check_mode and (dhcp_preview.stdout | trim | from_json).reload_required
  check_mode: false
- name: Report the DHCP preview and any activation blockers
  ansible.builtin.debug:
    msg: "{{ dhcp_preview.stdout | trim | from_json }}"
- name: Finish check mode before saving configuration or restarting services
  ansible.builtin.meta: end_role
  when: ansible_check_mode
- name: Require ready HOME addressing and no competing DHCP service
  ansible.builtin.assert:
    that:
    - (dhcp_preview.stdout | trim | from_json).apply_ready
    fail_msg: "{{ (dhcp_preview.stdout | trim | from_json).blockers | join('; ') }}"
- name: Save the validated owned Dnsmasq model as one locked transaction
  ansible.builtin.raw: "{{ dhcp_prefix }} apply {{ dhcp_payload | to_json | b64encode | quote }}"
  register: dhcp_apply
  changed_when: dhcp_apply.rc == 0 and (dhcp_apply.stdout | trim | from_json).changed
- name: Load DHCP and its interface-scoped firewall rules after a new or interrupted transaction
  ansible.builtin.raw: "{{ item }}"
  loop:
  - /usr/local/sbin/configctl dnsmasq restart
  - /usr/local/sbin/configctl filter reload
  when: (dhcp_apply.stdout | trim | from_json).reload_required
  changed_when: true
- name: Verify running DHCP before marking the transaction complete
  ansible.builtin.raw: "{{ dhcp_prefix }} complete {{ dhcp_payload | to_json | b64encode | quote }}"
  register: dhcp_complete
  changed_when: (dhcp_apply.stdout | trim | from_json).reload_required
  retries: 6
  delay: 5
  until: dhcp_complete is succeeded
- name: Verify the completed desired state
  ansible.builtin.include_tasks: verify.yml
