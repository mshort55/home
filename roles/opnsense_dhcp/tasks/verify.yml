---
- name: Verify owned saved configuration and running DHCP without writes
  ansible.builtin.raw: "{{ dhcp_prefix }} verify {{ dhcp_payload | to_json | b64encode | quote }}"
  register: dhcp_verified
  changed_when: false
  check_mode: false
- name: Report verified DHCP state
  ansible.builtin.debug:
    msg: "{{ dhcp_verified.stdout | trim | from_json }}"
