argument_specs:
  main:
    short_description: Install and verify an isolated UniFi OS Server; gate declarative configuration
      or optional restoration.
    options:
      unifi_host_options:
        type: dict
        required: true
        description: Explicit guest operation; no default.
        options:
          task_action:
            type: str
            required: true
            choices:
            - configure
            - verify
            - restore_ready
            - configuration_ready
            description: Matching public task filename.
      unifi_proxmox_host:
        type: str
        required: true
        description: Proxmox inventory host owning this guest.
      unifi_artifact_directory:
        type: path
        default: '{{ inventory_dir }}/.cache/unifi-artifacts'
        description: Verified controller installer cache.
      unifi_seed_directory:
        type: path
        default: '{{ inventory_dir }}/.cache/unifi-seed/{{ inventory_hostname }}'
        description: Pinned host identity, backup manifest and prepared GUI TLS inputs.
      unifi_backup_file:
        type: path
        default: '{{ inventory_dir }}/.cache/unifi-backup/authoritative.unf'
        description: Optional historical Network recovery backup; unused by declarative configuration.
