- name: Verify the installed controller before any manual backup restoration
  ansible.builtin.include_tasks: verify.yml
- name: Verify the scoped firewall and DNS transaction still matches
  ansible.builtin.include_role:
    name: unifi_network
    public: false
  vars:
    unifi_network_options:
      task_action: verify
- name: Inspect the authoritative backup and prepared GUI certificate privately
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    checksum_algorithm: sha256
  loop:
  - '{{ unifi_backup_file }}'
  - '{{ unifi_seed_directory }}/backup.json'
  - '{{ unifi_seed_directory }}/gui-cert.pem'
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  register: unifi_restore_artifacts
  no_log: true
- name: Require the original protected backup and TLS artifacts
  ansible.builtin.assert:
    that:
    - item.stat.isreg | default(false)
    - not item.stat.islnk | default(false)
    - item.stat.mode == '0600'
  loop: '{{ unifi_restore_artifacts.results }}'
  no_log: true
- name: Require the frozen authoritative Network 7.3.83 backup bytes
  ansible.builtin.assert:
    that:
    - unifi_restore_artifacts.results[0].stat.checksum == (lookup('ansible.builtin.file', unifi_seed_directory ~ '/backup.json')
      | from_json).sha256
    - (lookup('ansible.builtin.file', unifi_seed_directory ~ '/backup.json') | from_json).network_version == '7.3.83'
  no_log: true
- name: Verify TLS and isolation before optional historical backup restoration
  ansible.builtin.include_tasks: _readiness.yml
- name: Report readiness for the supported manual Network backup restore
  ansible.builtin.debug:
    msg:
      url: https://{{ ansible_host }}:11443
      backup: '{{ unifi_backup_file }}'
      next: Restore the authoritative .unf through the Network application backup interface, then review SSID/security/VLAN/mesh/inform
        settings while AP connectivity remains blocked. This playbook did not upload or restore the backup.
