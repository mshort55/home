---
- name: Verify the named guest and key-only administration
  ansible.builtin.include_tasks: _baseline_host.yml
- name: Independently verify the saved and live declarative firewall
  ansible.builtin.include_role:
    name: unifi_firewall
    public: false
  vars:
    unifi_firewall_options: {task_action: verify}
    unifi_firewall_settings: '{{ unifi_isolation_settings }}'
