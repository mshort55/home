---
- name: Verify the existing Wi-Fi transport without writes
  ansible.builtin.raw: "{{ wireguard_wifi_prefix }} verify {{ wireguard_wifi_payload | to_json | b64encode | quote }}"
  register: wireguard_wifi_client_read
  changed_when: false
  check_mode: false
- name: Select the existing client MTU
  ansible.builtin.set_fact:
    wireguard_wifi_plan: "{{ wireguard_wifi_client_read.stdout | trim | from_json }}"
- name: Refresh the protected Wi-Fi profile
  ansible.builtin.include_tasks: _client.yml
