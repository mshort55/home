---
argument_specs:
  main:
    short_description: Validate and dispatch opnsense_install actions.
    options:
      opnsense_install_options:
        type: dict
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        required: true
        options:
          task_action:
            type: str
            description: Select the matching action task file.
            required: true
            choices:
            - install
      opnsense_guest:
        type: str
        description: Inventory guest with seeded SSH identity.
      opnsense_vm:
        type: dict
        description: Owned VM hardware allocation.
        options: &id001
          vmid:
            type: int
            description: Owned numeric VM ID (100).
            required: true
          name:
            type: str
            description: Owned VM hostname.
            required: true
          cores:
            type: int
            description: Four virtual CPU cores.
            required: true
          memory_mib:
            type: int
            description: 8192 MiB of fixed guest RAM.
            required: true
          disk_gib:
            type: int
            description: 32 GiB system disk.
            required: true
          disk_storage:
            type: str
            description: Existing LVM-thin storage ID.
            required: true
          iso_storage:
            type: str
            description: Existing directory ISO storage ID.
            required: true
          onboot:
            type: bool
            description: Desired installed-guest host-startup behavior.
            required: true
          wan_connected:
            type: bool
            description: Desired pilot WAN link state.
            required: true
          networks:
            type: list
            description: Five ordered, stable VirtIO MAC-to-role mappings.
            elements: dict
            required: true
            options:
              device:
                type: str
                description: Proxmox network key.
                required: true
                choices:
                - net0
                - net1
                - net2
                - net3
                - net4
              role:
                type: str
                description: Assigned guest network role.
                required: true
                choices:
                - WAN
                - MGMT
                - HOME
                - DEV
                - BMC
              mac:
                type: str
                description: Stable guest MAC address.
                required: true
              bridge:
                type: str
                description: Existing data bridge.
                required: true
              tag:
                type: int
                description: Explicit non-WAN VLAN tag; absent on WAN.
      proxmox_network:
        type: dict
        description: Installed bridge identities.
      opnsense_bootstrap_dir:
        type: path
        description: Optional opnsense_install setting; preserves the existing workflow value.
        default: "{{ inventory_dir }}/.cache/opnsense-bootstrap/{{ inventory_hostname }}"
      opnsense_install_record_dir:
        type: path
        description: Optional opnsense_install setting; preserves the existing workflow value.
        default: /var/lib/home-automation/opnsense-100
  install:
    short_description: 'opnsense_install: install.'
    options:
      opnsense_install_options:
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        options:
          task_action:
            choices:
            - install
            description: Select the matching action task file.
            required: true
            type: str
        required: true
        type: dict
      opnsense_guest:
        type: str
        description: Inventory guest with seeded SSH identity.
        required: true
      opnsense_vm:
        type: dict
        description: Owned VM hardware allocation.
        required: true
        options: *id001
      proxmox_network:
        type: dict
        description: Installed bridge identities.
        required: true
