---
- name: Validate the effective controller endpoint contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
  tags: [always]
- name: Validate the certificate hostname and reviewed address
  ansible.builtin.assert:
    that:
      - fortigate_controller_endpoint.hostname is match('^[A-Za-z][A-Za-z0-9.-]*$')
      - fortigate_controller_endpoint.address is match('^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$')
      - fortigate_controller_endpoint.address.split('.') | map('int') | max <= 255
      - fortigate_controller_endpoint.address.split('.')[0] | int not in [0, 127]
    fail_msg: Declare the certificate hostname and the reviewed device IPv4 address in inventory.
  tags: [always]
- name: Dispatch the explicit controller operation
  ansible.builtin.include_tasks: "{{ fortigate_controller_options.task_action }}.yml"
  tags: [always]
