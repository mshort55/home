---
- name: Build the desired VM hardware
  ansible.builtin.set_fact:
    opnsense_expected:
      vmid: "{{ opnsense_vm.vmid }}"
      name: "{{ opnsense_vm.name }}"
      description: "{{ opnsense_owner_marker }}"
      bios: ovmf
      machine: q35
      ostype: other
      scsihw: virtio-scsi-single
      cores: "{{ opnsense_vm.cores }}"
      sockets: 1
      memory: "{{ opnsense_vm.memory_mib }}"
      balloon: 0
      numa: 0
      onboot: "{{ opnsense_vm.onboot | int }}"
      disk_gib: "{{ opnsense_vm.disk_gib }}"
      disk_storage: "{{ opnsense_vm.disk_storage }}"
      iso_volume: "{{ opnsense_iso_volume }}"
      bootstrap_iso_volume: "{{ opnsense_vm.iso_storage }}:iso/OPNsense-{{ opnsense_release.version }}-bootstrap-{{ inventory_hostname\
        \ }}.iso"
      networks: {}
    opnsense_create_networks: {}
- name: Add stable individually scoped VirtIO network definitions
  ansible.builtin.set_fact:
    opnsense_expected: "{{ opnsense_expected | combine({'networks': opnsense_expected.networks | combine({item.device: network_properties})})\
      \ }}"
    opnsense_create_networks: "{{ opnsense_create_networks | combine({item.device: network_argument}) }}"
  loop: "{{ opnsense_vm.networks }}"
  loop_control:
    label: "{{ item.device }} {{ item.role }}"
  vars:
    network_properties: "{{ {'model': 'virtio', 'macaddr': item.mac, 'bridge': item.bridge, 'firewall': '0'} | combine({'tag':\
      \ item.tag | string} if item.role != 'WAN' else {'link_down': (not opnsense_vm.wan_connected) | int | string}) }}"
    network_argument: "{{ 'virtio=' + item.mac + ',bridge=' + item.bridge + ',firewall=0' + (',tag=' + (item.tag | string)\
      \ if item.role != 'WAN' else ',link_down=' + ((not opnsense_vm.wan_connected) | int | string)) }}"
- name: Select the desired WAN connection argument
  ansible.builtin.set_fact:
    opnsense_wan_argument: "{{ opnsense_create_networks.net0 }}"
