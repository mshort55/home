---
argument_specs:
  main:
    short_description: Validate and dispatch opnsense_vm actions.
    options:
      opnsense_vm_options:
        type: dict
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        required: true
        options:
          task_action:
            type: str
            description: Select the matching action task file.
            required: true
            choices:
            - describe
            - create
            - verify
      opnsense_vm:
        type: dict
        description: Owned VM 100 hardware and five ordered network roles.
        options: &id001
          vmid:
            type: int
            description: Owned numeric VM ID (100).
            required: true
          name:
            type: str
            description: Owned VM hostname.
            required: true
          cores:
            type: int
            description: Four virtual CPU cores.
            required: true
          memory_mib:
            type: int
            description: 8192 MiB of fixed guest RAM.
            required: true
          disk_gib:
            type: int
            description: 32 GiB system disk.
            required: true
          disk_storage:
            type: str
            description: Existing LVM-thin storage ID.
            required: true
          iso_storage:
            type: str
            description: Existing directory ISO storage ID.
            required: true
          onboot:
            type: bool
            description: Desired installed-guest host-startup behavior.
            required: true
          wan_connected:
            type: bool
            description: Desired pilot WAN link state.
            required: true
          networks:
            type: list
            description: Five ordered, stable VirtIO MAC-to-role mappings.
            elements: dict
            required: true
            options:
              device:
                type: str
                description: Proxmox network key.
                required: true
                choices:
                - net0
                - net1
                - net2
                - net3
                - net4
              role:
                type: str
                description: Assigned guest network role.
                required: true
                choices:
                - WAN
                - MGMT
                - HOME
                - DEV
                - BMC
              mac:
                type: str
                description: Stable guest MAC address.
                required: true
              bridge:
                type: str
                description: Existing data bridge.
                required: true
              tag:
                type: int
                description: Explicit non-WAN VLAN tag; absent on WAN.
      proxmox_network:
        type: dict
        description: Installed management and isolated data bridges.
      opnsense_wan_assignment_confirmed:
        type: bool
        description: Console WAN/MGMT assignment has been checked before a WAN connect write.
        default: false
      opnsense_iso_cache:
        type: path
        description: Optional opnsense_vm setting; preserves the existing workflow value.
        default: "{{ inventory_dir }}/.cache/iso/opnsense-{{ opnsense_release.version }}"
      opnsense_release:
        type: dict
        description: Optional opnsense_vm setting; preserves the existing workflow value.
        default: "{{ (lookup('ansible.builtin.file', role_path ~ '/../../files/opnsense/release.yml') | from_yaml).opnsense_release\
          \ }}"
      opnsense_verify_wan_state:
        type: bool
        description: Require the requested WAN link during verification; pilot preflight explicitly disables this comparison.
        default: true
      opnsense_iso_volume:
        type: str
        description: Optional opnsense_vm setting; preserves the existing workflow value.
        default: "{{ opnsense_vm.iso_storage }}:iso/{{ opnsense_release.filename }}"
      opnsense_owner_marker:
        type: str
        description: Optional opnsense_vm setting; preserves the existing workflow value.
        default: Managed by create-opnsense-vm.yml; vmid={{ opnsense_vm.vmid }}
  describe:
    short_description: 'opnsense_vm: describe.'
    options:
      opnsense_vm_options:
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        options:
          task_action:
            choices:
            - describe
            description: Select the matching action task file.
            required: true
            type: str
        required: true
        type: dict
      opnsense_vm:
        type: dict
        description: Owned VM 100 hardware and five ordered network roles.
        required: true
        options: *id001
  create:
    short_description: 'opnsense_vm: create.'
    options:
      opnsense_vm_options:
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        options:
          task_action:
            choices:
            - create
            description: Select the matching action task file.
            required: true
            type: str
        required: true
        type: dict
      opnsense_vm:
        type: dict
        description: Owned VM 100 hardware and five ordered network roles.
        required: true
        options: *id001
      proxmox_network:
        type: dict
        description: Installed management and isolated data bridges.
        required: true
  verify:
    short_description: 'opnsense_vm: verify.'
    options:
      opnsense_vm_options:
        description: Role-scoped parameters. The task_action field is required; there is no default action.
        options:
          task_action:
            choices:
            - verify
            description: Select the matching action task file.
            required: true
            type: str
        required: true
        type: dict
      opnsense_vm:
        type: dict
        description: Owned VM 100 hardware and five ordered network roles.
        required: true
        options: *id001
      proxmox_network:
        type: dict
        description: Installed management and isolated data bridges.
        required: true
