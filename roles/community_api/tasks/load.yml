---
- name: Inspect controller API credentials and certificate trust
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/.cache/community-api/{{ community_api_host }}/{{ item }}"
    follow: false
  loop:
  - credentials.json
  - ca.pem
  delegate_to: localhost
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: community_api_files
  no_log: true
- name: Require protected enrolled API files
  ansible.builtin.assert:
    that:
    - item.stat.isreg | default(false)
    - not item.stat.islnk | default(false)
    - item.stat.mode == '0600'
    fail_msg: Run {{ 'configure-proxmox-api.yml' if community_api_var == 'pve_api' else 'configure-opnsense-api.yml' }} for
      this host on this controller first.
  loop: "{{ community_api_files.results }}"
  no_log: true
- name: Load enrolled API credentials without displaying secrets
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/.cache/community-api/{{ community_api_host }}/credentials.json"
    name: "{{ community_api_var }}"
  no_log: true
- name: Match the enrolled endpoint to inventory
  ansible.builtin.assert:
    that:
    - enrolled_address == hostvars[community_api_host].ansible_host
    - community_api_var != 'pve_api' or enrolled.node == community_api_host
    fail_msg: API credentials belong to another inventory endpoint.
  vars:
    enrolled: "{{ lookup('ansible.builtin.vars', community_api_var) }}"
    enrolled_address: "{{ enrolled.api_host if community_api_var == 'pve_api' else enrolled.firewall }}"
  no_log: true
