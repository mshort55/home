---
- name: Verify saved firewall policy and running DNS, time and pilot WAN services
  ansible.builtin.raw: "{{ boot_pilot_prefix }} network {{ boot_pilot_payload | to_json | b64encode | quote }}"
  delegate_to: "{{ opnsense_guest }}"
  register: boot_guest_network
  changed_when: false
  check_mode: false
  retries: 36
  delay: 5
  until: boot_guest_network is succeeded
- name: Verify management DNS, NAT and trusted outbound HTTPS from Proxmox
  ansible.builtin.uri:
    url: https://enterprise.proxmox.com/
    validate_certs: true
    use_proxy: false
    status_code:
    - 200
    - 401
    return_content: false
    timeout: 30
  register: boot_https
  check_mode: false
  retries: 6
  delay: 5
  until: boot_https is succeeded
