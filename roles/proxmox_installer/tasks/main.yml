---
- name: Validate the selected proxmox_installer action contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs[proxmox_installer_options.task_action].options\
      \ }}"
    validate_args_context:
      name: proxmox_installer
      type: role
      argument_spec_name: "{{ proxmox_installer_options.task_action }}"
  tags:
  - always
- name: Dispatch the explicit proxmox_installer action
  ansible.builtin.include_tasks:
    file: "{{ proxmox_installer_options.task_action }}.yml"
  tags:
  - always
