---
- name: Select the next advertised network inventory resource
  ansible.builtin.set_fact:
    idrac_network_path: "{{ idrac_network_pending[0] }}"
  no_log: true
- name: Require a local network or PCIe inventory path before sending credentials
  ansible.builtin.assert:
    that:
    - idrac_network_path is string
    - idrac_network_path is match('^/redfish/v1/((Systems|Chassis)/[A-Za-z0-9_.:-]+/(EthernetInterfaces|NetworkInterfaces|NetworkAdapters|PCIeDevices?|PCIeFunctions?)|Managers/[A-Za-z0-9_.:-]+/EthernetInterfaces)(/([A-Za-z0-9_.:-]|%23|%3[Aa]|%7[Cc])+)*/*$')
    - '''..'' not in idrac_network_path.split(''/'')'
    - '''.'' not in idrac_network_path.split(''/'')'
    - '''Actions'' not in idrac_network_path.split(''/'')'
    fail_msg: The advertised link is outside the allowed local network inventory paths.
  no_log: true
- name: Read the network inventory resource using verified HTTPS
  ansible.builtin.uri:
    url: https://{{ ansible_host }}{{ idrac_network_path }}
    method: GET
    url_username: "{{ vault_devices[inventory_hostname].username }}"
    url_password: "{{ vault_devices[inventory_hostname].password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ idrac_ca_path }}"
    ciphers: "{{ idrac_tls_ciphers | default(omit) }}"
    follow_redirects: none
    use_proxy: false
    return_content: true
    status_code:
    - 200
    - 404
    - 501
    timeout: 30
  register: idrac_network_read
  until: idrac_network_read.status | default(0) != -1 or 'timed out' not in (idrac_network_read.msg | default('') | lower)
  retries: 2
  delay: 5
  no_log: true
  diff: false
- name: Save the network response without request credentials
  ansible.builtin.set_fact:
    idrac_network_resources: |-
      {{ idrac_network_resources | combine({idrac_network_path: {
        'http_status': idrac_network_read.status,
        'body': idrac_network_read.json | default({})}}) }}
    idrac_network_body: "{{ idrac_network_read.json | default({}) if idrac_network_read.status == 200 else {} }}"
  no_log: true
- name: Queue advertised network members and related inventory once each
  ansible.builtin.set_fact:
    idrac_network_pending: |-
      {%- set links = namespace(paths=idrac_network_pending[1:]) -%} {%- set related = namespace(items=idrac_network_body.Members | default([])) -%} {%- for body in [idrac_network_body, idrac_network_body.get('Links', {})] +
                     (idrac_network_body.Controllers | default([])) +
                     (idrac_network_body.Controllers | default([]) | map(attribute='Links', default={}) | list) -%}
      {%- for key in ['EthernetInterfaces', 'NetworkInterfaces', 'NetworkAdapter', 'NetworkAdapters',
                     'NetworkPorts', 'NetworkDeviceFunction', 'NetworkDeviceFunctions',
                     'PCIeDevice', 'PCIeDevices', 'PCIeFunction', 'PCIeFunctions',
                     'PhysicalPortAssignment', 'PhysicalNetworkPortAssignment'] -%}
      {%- set value = body.get(key, []) -%} {%- set related.items = related.items + ([value] if value is mapping else value if value is sequence and value is not string else []) -%} {%- endfor -%} {%- endfor -%} {%- for link in related.items -%} {%- if link is mapping and '@odata.id' in link -%} {%- set links.paths = links.paths + [link['@odata.id']] -%} {%- endif -%} {%- endfor -%} {{ links.paths | unique | reject('in', idrac_network_resources) | list }}
  no_log: true
- name: Continue bounded network inventory discovery
  ansible.builtin.include_tasks: _network.yml
  when:
  - idrac_network_pending | length > 0
  - idrac_network_resources | length < 128
