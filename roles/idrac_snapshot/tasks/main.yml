---
- name: Validate the selected idrac_snapshot action contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs[idrac_snapshot_options.task_action].options\
      \ }}"
    validate_args_context:
      name: idrac_snapshot
      type: role
      argument_spec_name: "{{ idrac_snapshot_options.task_action }}"
  tags:
  - always
- name: Dispatch the explicit idrac_snapshot action
  ansible.builtin.include_tasks:
    file: "{{ idrac_snapshot_options.task_action }}.yml"
  tags:
  - always
