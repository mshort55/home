---
- name: Validate the selected opnsense_media action contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs[opnsense_media_options.task_action].options\
      \ }}"
    validate_args_context:
      name: opnsense_media
      type: role
      argument_spec_name: "{{ opnsense_media_options.task_action }}"
  tags:
  - always
- name: Dispatch the explicit opnsense_media action
  ansible.builtin.include_tasks:
    file: "{{ opnsense_media_options.task_action }}.yml"
  tags:
  - always
