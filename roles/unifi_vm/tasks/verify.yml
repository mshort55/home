---
- name: Verify owned VM hardware and installation record without writes
  ansible.builtin.include_tasks: _read.yml
- name: Require a completed permanent guest
  ansible.builtin.assert:
    that: [unifi_current.exists, unifi_current.has_disk, unifi_current.previous.phase == 'complete']
- name: Verify guest identity and security when running
  ansible.builtin.include_tasks: _guest.yml
  when: unifi_current.state == 'running'
