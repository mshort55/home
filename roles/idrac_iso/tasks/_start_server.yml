---
- name: Inspect the selected native Mac ISO and verify its checksum
  ansible.builtin.stat:
    path: "{{ idrac_iso_path }}"
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  register: iso_file
  no_log: true
- name: Require a regular nonempty ISO with the expected bytes
  ansible.builtin.assert:
    that:
    - iso_file.stat.isreg | default(false)
    - not iso_file.stat.islnk | default(false)
    - iso_file.stat.size | default(0) > 0
    - iso_file.stat.checksum | default('') == idrac_iso_sha256
    fail_msg: The native Mac ISO is missing, is a symlink, or does not match the supplied SHA-256.
- name: Create the private server state directory
  ansible.builtin.file:
    path: "{{ iso_server_directory }}"
    state: directory
    mode: '0700'
- name: Inspect the temporary launchd job
  ansible.builtin.command:
    argv:
    - launchctl
    - print
    - gui/{{ ansible_facts.user_uid }}/{{ iso_server_label }}
  register: iso_launchd_before
  changed_when: false
  failed_when: iso_launchd_before.rc not in [0, 113]
  no_log: true
- name: Preview the server helper contents
  ansible.builtin.copy:
    src: "{{ (role_path ~ '/../..') | realpath }}/scripts/serve-iso.py"
    dest: "{{ iso_server_directory }}/serve-iso.py"
    mode: '0600'
  check_mode: true
  register: iso_helper_plan
  no_log: true
  diff: false
- name: Preview the launchd job configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/iso-server.plist.j2"
    dest: "{{ iso_server_directory }}/server.plist"
    mode: '0600'
  check_mode: true
  register: iso_plist_plan
  no_log: true
  diff: false
- name: Refuse to interrupt mounted media for server changes
  ansible.builtin.assert:
    that:
    - not iso_before.results[2].json.Inserted or (not iso_helper_plan.changed and not iso_plist_plan.changed)
    fail_msg: The running server configuration differs while its ISO is attached. Eject that ISO before changing its source
      or helper.
- name: Unload an outdated or stopped temporary job before rebuilding it
  ansible.builtin.command:
    argv:
    - launchctl
    - bootout
    - gui/{{ ansible_facts.user_uid }}/{{ iso_server_label }}
  when: iso_launchd_before.rc == 0 and (iso_helper_plan.changed or iso_plist_plan.changed or iso_launchd_before.stdout is
    not search('state = running'))
  register: iso_launchd_unloaded
  changed_when: true
  no_log: true
- name: Install the single-file server helper
  ansible.builtin.copy:
    src: "{{ (role_path ~ '/../..') | realpath }}/scripts/serve-iso.py"
    dest: "{{ iso_server_directory }}/serve-iso.py"
    mode: '0600'
  diff: false
- name: Install the temporary launchd job configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/iso-server.plist.j2"
    dest: "{{ iso_server_directory }}/server.plist"
    mode: '0600'
  no_log: true
  diff: false
- name: Protect the server log
  ansible.builtin.file:
    path: "{{ iso_server_directory }}/server.log"
    state: touch
    access_time: preserve
    modification_time: preserve
    mode: '0600'
- name: Start the temporary launchd job
  ansible.builtin.command:
    argv:
    - launchctl
    - bootstrap
    - gui/{{ ansible_facts.user_uid }}
    - "{{ iso_server_directory }}/server.plist"
  when: iso_launchd_before.rc != 0 or iso_launchd_unloaded is changed
  changed_when: true
  no_log: true
- name: Wait for the HTTP listener on the Mac Ethernet address
  ansible.builtin.wait_for:
    host: "{{ idrac_iso_bind_address }}"
    port: "{{ idrac_iso_port }}"
    timeout: 20
- name: Verify a byte-range response without iDRAC credentials
  ansible.builtin.uri:
    url: "{{ iso_requested_url }}"
    method: GET
    headers:
      Range: bytes=0-0
    status_code: 206
    url_username: null
    url_password: null
    force_basic_auth: false
    return_content: false
    ca_path: null
    ciphers: null
  register: iso_http_probe
  no_log: true
- name: Require the intended server bytes and range metadata
  ansible.builtin.assert:
    that:
    - iso_http_probe.content_length | int == 1
    - iso_http_probe.content_range == 'bytes 0-0/' ~ (iso_file.stat.size | string)
    - iso_http_probe.etag == '"' ~ idrac_iso_sha256 ~ '"'
    fail_msg: The local HTTP listener does not serve the selected checksum-verified ISO with byte-range support.
  no_log: true
