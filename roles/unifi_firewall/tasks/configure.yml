---
- name: Inspect ownership and current policy before configuration or legacy migration
  ansible.builtin.include_tasks: _inspect.yml
  vars:
    unifi_firewall_inspection_mode: plan
- name: Preserve the pre-change firewall state for rollback
  ansible.builtin.set_fact:
    unifi_firewall_before: '{{ unifi_firewall_inspection.stdout | from_json }}'
- name: Ask the kernel to validate the complete replacement without changing rules
  ansible.builtin.command:
    argv: [/usr/sbin/nft, --check, -j, -f, '-']
    stdin: '{{ unifi_firewall_policy | to_json }}'
  check_mode: false
  changed_when: false
- name: Maintain only the owned firewall artifacts and service
  vars:
    unifi_firewall_files:
    - dest: /etc/home-automation/unifi-policy.nft.json
      content: '{{ unifi_firewall_policy | to_nice_json }}'
      mode: '0600'
    - dest: /etc/systemd/system/home-unifi-isolation.service
      content: '{{ lookup("ansible.builtin.template", "isolation.service.j2") }}'
      mode: '0644'
    - dest: /etc/systemd/system/uosserver.service.d/10-home-isolation.conf
      content: '{{ lookup("ansible.builtin.template", "guard.conf.j2") }}'
      mode: '0644'
    - dest: /etc/systemd/system/uosserver-updater.service.d/10-home-isolation.conf
      content: '{{ lookup("ansible.builtin.template", "guard.conf.j2") }}'
      mode: '0644'
  block:
  - name: Install or preview the declarative policy and native startup commands
    ansible.builtin.copy:
      content: '{{ item.content }}'
      dest: '{{ item.dest }}'
      owner: root
      group: root
      mode: '{{ item.mode }}'
      follow: false
      backup: true
      validate: "{{ '/usr/sbin/nft --check -j -f %s' if item.dest.endswith('.json') else omit }}"
    loop: '{{ unifi_firewall_files }}'
    loop_control:
      label: '{{ item.dest }}'
    register: unifi_firewall_writes
  - name: Report loaded policy drift in the configuration preview
    ansible.builtin.debug:
      msg: 'Apply the inventory-owned firewall table atomically; retain unrelated tables and service availability.'
    changed_when: not unifi_firewall_before.live_matches
    when: ansible_check_mode
  - name: Preview removal of the obsolete policy-generating helper
    ansible.builtin.file:
      path: /usr/local/lib/home-automation/unifi-isolation.py
      state: absent
    when: ansible_check_mode
  - name: Finish the firewall preview before service changes
    ansible.builtin.meta: end_role
    when: ansible_check_mode
  - name: Load the managed unit definitions without restarting UniFi
    ansible.builtin.systemd_service:
      daemon_reload: true
    when: unifi_firewall_writes.changed
  - name: Retain the enabled firewall startup service
    ansible.builtin.systemd_service:
      name: home-unifi-isolation
      enabled: true
      state: started
  - name: Atomically apply only the owned table when configuration or live policy differs
    ansible.builtin.systemd_service:
      name: home-unifi-isolation
      state: reloaded
    when: unifi_firewall_writes.changed or not unifi_firewall_before.live_matches
  - name: Independently verify persistence and effective policy after configuration
    ansible.builtin.include_tasks: verify.yml
  rescue:
  - name: Restore prior managed files from Ansible backups after a failed configuration
    ansible.builtin.copy:
      src: '{{ item.backup_file }}'
      dest: '{{ item.dest }}'
      remote_src: true
      owner: root
      group: root
      mode: '{{ item.item.mode }}'
    loop: '{{ unifi_firewall_writes.results | default([]) }}'
    loop_control:
      label: '{{ item.item.dest }}'
    when: not ansible_check_mode and item.backup_file is defined
  - name: Remove newly introduced artifacts after a failed migration
    ansible.builtin.file:
      path: '{{ item.item.dest }}'
      state: absent
    loop: '{{ unifi_firewall_writes.results | default([]) }}'
    loop_control:
      label: '{{ item.item.dest }}'
    when: not ansible_check_mode and item.changed | default(false) and item.item.dest not in unifi_firewall_before.present
  - name: Reload restored service definitions
    ansible.builtin.systemd_service:
      daemon_reload: true
    when: not ansible_check_mode
  - name: Atomically restore the prior owned firewall table
    ansible.builtin.command:
      argv: [/usr/sbin/nft, -j, -f, '-']
      stdin: '{{ unifi_firewall_before.rollback_policy | to_json }}'
    changed_when: true
    when: not ansible_check_mode
  - name: Report the failed firewall operation after rollback
    ansible.builtin.fail:
      msg: 'Firewall configuration failed. Prior files and owned rules were restored when applying; inspect the original failure before retrying.'
- name: Remove the obsolete policy-generating helper after successful migration
  ansible.builtin.file:
    path: /usr/local/lib/home-automation/unifi-isolation.py
    state: absent
