---
- name: Validate the selected idrac_boot action contract
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs[idrac_boot_options.task_action].options\
      \ }}"
    validate_args_context:
      name: idrac_boot
      type: role
      argument_spec_name: "{{ idrac_boot_options.task_action }}"
  tags:
  - always
- name: Prepare the explicitly reviewed current iDRAC controller endpoint
  ansible.builtin.assert:
    that: idrac_controller_endpoint.hostname == hostvars[inventory_hostname].ansible_host
    fail_msg: The reviewed current endpoint must use the inventory certificate hostname.
  when: idrac_controller_endpoint is defined
- name: Restore controller hostname resolution before iDRAC requests
  ansible.builtin.include_role:
    name: controller_hostname
    public: false
  vars:
    controller_hostname_options:
      task_action: prepare
    controller_hostname_endpoint: "{{ idrac_controller_endpoint }}"
  when: idrac_controller_endpoint is defined
- name: Dispatch the explicit idrac_boot action
  ansible.builtin.include_tasks:
    file: "{{ idrac_boot_options.task_action }}.yml"
  tags:
  - always
