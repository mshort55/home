rebind-localhost-ok
stop-dns-rebind
port=0
# If you want dnsmasq to listen for DHCP and DNS requests only on
# specified interfaces (and the loopback) give the name of the
# interface (eg eth0) here.
# Repeat the line for more than one interface.
interface=dhcp-server
dhcp-lease-max=115
dhcp-fqdn
domain=home.test
# This tells dnsmasq that a domain is local and it may answer queries from /etc/hosts
# or DHCP but should never forward queries on that domain to any upstream servers.
local=/home.test/
dhcp-authoritative
dhcp-reply-delay=0
# On systems which support it, dnsmasq binds the wildcard address,
# even when it is listening on only some interfaces. It then discards
# requests that it shouldn't reply to. This has the advantage of
# working even when interfaces come and go and change address. If you
# want dnsmasq to really bind only the interfaces it is listening on,
# uncomment this option. About the only time you may need this is when
# running another nameserver on the same machine.
bind-interfaces
# Never forward to servers in /etc/resolv.conf
no-resolv
# If you don't want dnsmasq to read /etc/hosts, uncomment the
# following line.
no-hosts
# host entries flushed via dnsmasq_watcher.py [isc] and a dump of the static reservations
addn-hosts=/var/etc/dnsmasq-hosts
addn-hosts=/var/etc/dnsmasq-leases
dns-forward-max=5000
cache-size=10000
local-ttl=1
conf-dir=/usr/local/etc/dnsmasq.conf.d,*.conf
dhcp-range=tag:dhcp-server,192.0.2.20,192.0.2.115,255.255.255.0,3600
domain=home.test,192.0.2.20,192.0.2.115
dhcp-range=tag:dhcp-server,192.0.2.117,192.0.2.134,255.255.255.0,3600
domain=home.test,192.0.2.117,192.0.2.134
dhcp-host=id:*,02:00:00:00:00:01,192.0.2.116,printer,3600
dhcp-option=tag:dhcp-server,3,192.0.2.254
dhcp-option=tag:dhcp-server,6,192.0.2.254
dhcp-option=tag:dhcp-server,15,home.test
dhcp-option=tag:dhcp-server,42,192.0.2.254
dhcp-option=tag:dhcp-server,119,home.test
# default IPv4 DNS mapped to this server (0.0.0.0)
dhcp-option=6,0.0.0.0
# default IPv6 DNS mapped to this server (::)
dhcp-option=option6:23,[::]
# If a DHCP client claims that its name is "wpad", ignore that.
# This fixes a security hole. see CERT Vulnerability VU#598349
dhcp-name-match=set:wpad-ignore,wpad
dhcp-ignore-names=tag:wpad-ignore
